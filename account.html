<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13102E">
<title>Your account, StudioLAB Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/form.css?v=20260514a">
<style>
  /* Local semantic-status tokens. Mirrors the admin pill palette so studio
     and admin views read identically for paid / authorised / card_saved /
     pending / info / crit / muted statuses. */
  :root {
    --st-ok-fg:    #047857;  --st-ok-bg:    #D1FAE5;
    --st-warn-fg:  #B45309;  --st-warn-bg:  #FEF3C7;
    --st-info-fg:  #1E40AF;  --st-info-bg:  #DBEAFE;
    --st-crit-fg:  #B91C1C;  --st-crit-bg:  #FEE2E2;
    --st-err-fg:   #991B1B;  --st-err-bg:   #FEF2F2;  --st-err-bd: #FCA5A5;
  }
  .acct-wrap { max-width: 880px; margin: 32px auto 80px; padding: 0 16px; }
  .acct-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .acct-hdr h1 { font-size: 26px; font-weight: 800; color: var(--in-d); margin: 0 0 4px; letter-spacing: -0.4px; }
  .acct-hdr .acct-sub { color: var(--g6); font-size: 14px; }
  .acct-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acct-pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .acct-pill-plan { background: var(--in-l); color: var(--in-d); }
  .acct-pill-status-paid { background: var(--st-ok-bg); color: var(--st-ok-fg); }
  .acct-pill-status-authorised { background: var(--st-warn-bg); color: var(--st-warn-fg); }
  .acct-pill-status-card_saved { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-pill-status-pending { background: var(--g2); color: var(--g6); }
  /* Quote-specific pill variants. Sent/Viewed = info blue. Cancelled/
     Declined = red. Expired/Revised = neutral grey. */
  .acct-pill-status-info { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-pill-status-crit { background: var(--st-crit-bg); color: var(--st-crit-fg); }
  .acct-pill-status-muted { background: var(--g2); color: var(--g6); }

  .acct-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(19,16,46,.06); padding: 22px 24px; margin-bottom: 18px; }
  .acct-card h2 { font-size: 14px; font-weight: 700; color: var(--g6); margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.6px; }
  .acct-card .acct-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--g1); font-size: 13px; }
  .acct-card .acct-row:last-child { border-bottom: 0; }
  .acct-card .acct-k { width: 160px; flex-shrink: 0; color: var(--g6); }
  .acct-card .acct-v { color: var(--in-d); }
  .acct-card .acct-v a { color: var(--in); text-decoration: none; font-weight: 600; }

  .acct-next ol { margin: 0; padding-left: 20px; color: var(--in-d); }
  .acct-next li { margin-bottom: 8px; line-height: 1.55; }
  /* "What happens next" upgraded layout — a four-step status block that
     reads as a definition list rather than a numbered queue, so the studio
     understands what we have, what we're doing, what we need from them,
     and what happens at the end. Plan-agnostic copy lives in JS. */
  .acct-stages { display: grid; gap: 14px; }
  .acct-stage { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: flex-start; }
  .acct-stage-icon { width: 28px; height: 28px; border-radius: 999px; background: var(--in-l); color: var(--in-d); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .acct-stage-label { font-size: 13px; font-weight: 700; color: var(--in-d); margin: 4px 0 2px; }
  .acct-stage-body { font-size: 13px; line-height: 1.55; color: var(--g6); }

  /* Inline message thread + composer. Replaces the old "reply to email"
     dead-end with a directly-usable thread on the account page itself.
     Mirrors portal.html visual idiom but compacted for embed. */
  .acct-thread { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px 2px; margin-bottom: 14px; scrollbar-gutter: stable; }
  .acct-thread-empty { color: var(--g6); font-style: italic; text-align: center; padding: 28px 12px; font-size: 13px; }
  .acct-thread-loading { color: var(--g6); font-style: italic; padding: 12px 0; font-size: 13px; }
  .acct-msg-bubble { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
  .acct-msg-bubble .acct-msg-meta { font-size: 11px; color: var(--g6); margin-bottom: 4px; font-weight: 600; }
  .acct-msg-bubble .acct-msg-body { color: var(--in-d); }
  .acct-msg-bubble .acct-msg-body p { margin: 0 0 6px; }
  .acct-msg-bubble .acct-msg-body p:last-child { margin-bottom: 0; }
  .acct-msg-bubble .acct-msg-body a { color: var(--in); }
  .acct-msg-mine { align-self: flex-end; background: var(--in); color: #fff; }
  .acct-msg-mine .acct-msg-meta { color: rgba(255,255,255,0.85); }
  .acct-msg-mine .acct-msg-body { color: #fff; }
  .acct-msg-mine .acct-msg-body a { color: #fff; text-decoration: underline; }
  .acct-msg-them { align-self: flex-start; background: var(--g1); }
  .acct-msg-system { align-self: center; background: transparent; padding: 4px 12px; color: var(--g6); font-size: 12px; font-style: italic; }
  .acct-msg-system .acct-msg-body { color: var(--g6); }

  .acct-compose { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--g1); padding-top: 14px; }
  .acct-compose textarea { width: 100%; min-height: 80px; padding: 12px 14px; border: 1px solid var(--g2); border-radius: 10px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: vertical; color: var(--in-d); background: #fff; }
  .acct-compose textarea:focus { outline: 2px solid var(--in); outline-offset: 1px; border-color: var(--in); }
  .acct-compose-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .acct-compose-hint { color: var(--g6); font-size: 12px; flex: 1; min-width: 200px; }
  .acct-compose-hint a { color: var(--in); font-weight: 600; }
  .acct-compose-err { color: var(--st-err-fg); font-size: 12px; }
  .acct-compose button { min-width: 96px; }
  .acct-compose button[disabled] { opacity: 0.55; cursor: not-allowed; }
  /* Attachment chips on the inline composer. Pre-send the file picker
     stashes File objects in state; chips render here so the studio can
     remove one before hitting Send. Mirrors portal.js's pattern but
     compacted for the embedded composer. */
  .acct-compose-files { display: flex; flex-wrap: wrap; gap: 6px; }
  .acct-file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; background: var(--g1); border-radius: 999px; font-size: 12px; color: var(--in-d); }
  .acct-file-chip.oversize { background: var(--st-err-bg); color: var(--st-err-fg); }
  .acct-file-chip button { background: transparent; border: 0; color: var(--g6); font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .acct-file-chip button:hover { color: var(--st-crit-fg); }
  .acct-attach-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--g2); border-radius: 999px; font-size: 12px; color: var(--in-d); cursor: pointer; background: #fff; font-weight: 600; }
  .acct-attach-btn:hover { border-color: var(--in); color: var(--in); }
  .acct-attach-btn input { display: none; }

  /* Inline editing. Each editable card gets a pencil button in its
     header; clicking swaps the static rows for an inline form with
     Save / Cancel. Locked fields stay rendered as static rows even
     in edit mode so the studio sees what they can't touch. */
  .acct-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .acct-card-hdr h2 { margin: 0; }
  .acct-edit-btn { background: transparent; border: 0; color: var(--in); font-size: 12px; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 6px; min-height: 32px; }
  .acct-edit-btn:hover { background: var(--in-l); }
  .acct-edit-btn:focus-visible { outline: 2px solid var(--in); outline-offset: 1px; }
  .acct-edit-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px; align-items: start; }
  .acct-edit-grid label { color: var(--g6); font-size: 13px; padding: 10px 0 0; }
  .acct-edit-grid .acct-edit-locked { color: var(--in-d); font-size: 13px; padding: 10px 0 0; }
  .acct-edit-grid input[type="text"],
  .acct-edit-grid input[type="url"],
  .acct-edit-grid input[type="tel"],
  .acct-edit-grid input[type="email"],
  .acct-edit-grid select,
  .acct-edit-grid textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--g2); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--in-d); background: #fff; }
  .acct-edit-grid input:focus,
  .acct-edit-grid select:focus,
  .acct-edit-grid textarea:focus { outline: 2px solid var(--in); outline-offset: 1px; border-color: var(--in); }
  .acct-edit-grid textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .acct-edit-grid input[type="color"] { width: 50px; height: 36px; padding: 2px; border: 1px solid var(--g2); border-radius: 8px; }
  .acct-edit-actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; padding-top: 6px; }
  .acct-edit-actions .acct-edit-msg { flex: 1; font-size: 12px; color: var(--g6); }
  .acct-edit-actions .acct-edit-msg.err { color: var(--st-err-fg); }
  .acct-edit-actions .acct-edit-msg.ok { color: var(--st-ok-fg); }

  /* Tab navigation. Three panels: Home (status + messages), Billing
     (invoices + quotes), Setup (the editable cards). The previous
     single-stack layout had the editable cards below the fold so the
     studio had to scroll past status and invoices to find the actions
     -- which read as "no actions available." Tabs put each surface one
     click from the top. Tabs are hidden once status='active' since the
     onboarding portal is done at that point. */
  .acct-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--g2); margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; }
  .acct-tabs::-webkit-scrollbar { display: none; }
  .acct-tab { background: transparent; border: 0; padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--g6); cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; min-height: 44px; transition: color 0.15s, border-color 0.15s; }
  .acct-tab:hover { color: var(--in-d); }
  .acct-tab:focus-visible { outline: 2px solid var(--in); outline-offset: -2px; border-radius: 4px; }
  .acct-tab.active { color: var(--in); border-bottom-color: var(--in); }
  .acct-tab .acct-tab-badge { background: var(--mg); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; line-height: 1.4; }
  .acct-tab .acct-tab-count { background: var(--g1); color: var(--g6); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; line-height: 1.4; }
  .acct-tab.active .acct-tab-count { background: var(--in-l); color: var(--in); }
  .acct-tab-panel { display: none; }
  .acct-tab-panel.active { display: block; }

  /* "Request a change" card. Lives on the Home tab above Messages so
     it is the first action surface the studio sees post-login. Lists
     their existing requests with status pills; a primary CTA opens the
     modal for a new request. Hidden post-activation since the GHL
     platform owns the relationship from that point. */
  .acct-req-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
  .acct-req-hdr h2 { margin: 0; }
  .acct-req-hdr-sub { color: var(--g6); font-size: 12px; line-height: 1.55; margin: 4px 0 0; max-width: 460px; }
  .acct-req-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .acct-req-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: start; padding: 12px 14px; background: var(--g1); border-radius: 10px; }
  .acct-req-row-title { font-size: 13px; font-weight: 700; color: var(--in-d); }
  .acct-req-row-meta { font-size: 12px; color: var(--g6); line-height: 1.55; }
  .acct-req-row-meta a { color: var(--in); font-weight: 600; }
  .acct-req-row-notes { grid-column: 1 / -1; font-size: 12px; color: var(--g6); padding: 8px 0 0; line-height: 1.55; border-top: 1px dashed var(--g2); margin-top: 8px; white-space: pre-wrap; }
  .acct-req-row-decline { grid-column: 1 / -1; font-size: 12px; color: var(--st-err-fg); padding: 6px 10px; background: var(--st-err-bg); border-radius: 6px; margin-top: 6px; }
  .acct-req-empty { color: var(--g6); font-size: 13px; font-style: italic; padding: 10px 0 0; }
  .acct-req-pill-open      { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-req-pill-quoted    { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-req-pill-paid      { background: var(--st-warn-bg); color: var(--st-warn-fg); }
  .acct-req-pill-applied   { background: var(--st-ok-bg); color: var(--st-ok-fg); }
  .acct-req-pill-declined  { background: var(--g2); color: var(--g6); }
  .acct-req-pill-withdrawn { background: var(--g2); color: var(--g6); }

  /* Modal for the request form. Vanilla overlay -- portal.html and
     friends use the same idiom of a dimmed backdrop with a centred
     card. Keyboard escape closes it. */
  .acct-modal-backdrop { position: fixed; inset: 0; background: rgba(19,16,46,0.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px 16px; overflow-y: auto; }
  .acct-modal-card { background: #fff; border-radius: 14px; max-width: 520px; width: 100%; padding: 24px 26px; box-shadow: 0 20px 60px rgba(19,16,46,0.25); }
  .acct-modal-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .acct-modal-hdr h3 { margin: 0; font-size: 18px; font-weight: 800; color: var(--in-d); letter-spacing: -0.3px; }
  .acct-modal-close { background: transparent; border: 0; font-size: 22px; color: var(--g6); cursor: pointer; line-height: 1; padding: 4px 8px; }
  .acct-modal-close:hover { color: var(--in-d); }
  .acct-modal-sub { color: var(--g6); font-size: 13px; line-height: 1.55; margin: 0 0 16px; }
  .acct-modal-form label { display: block; font-size: 12px; font-weight: 700; color: var(--in-d); margin: 12px 0 6px; }
  .acct-modal-form select,
  .acct-modal-form textarea,
  .acct-modal-form input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--g2); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--in-d); background: #fff; }
  .acct-modal-form select:focus,
  .acct-modal-form textarea:focus,
  .acct-modal-form input:focus { outline: 2px solid var(--in); outline-offset: 1px; border-color: var(--in); }
  .acct-modal-form textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  .acct-modal-current { font-size: 12px; color: var(--g6); margin: 4px 0 0; }
  .acct-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; align-items: center; flex-wrap: wrap; }
  .acct-modal-actions .acct-modal-err { flex: 1; font-size: 12px; color: var(--st-err-fg); min-width: 200px; }
  .acct-modal-actions button { min-width: 100px; }

  /* Activation banner. Replaces "Where you're at" + "Messages" stack
     once the admin marks the studio active, since the onboarding portal
     has done its job. Communication and product use move to the GHL
     platform; this surface becomes a confirmation page. */
  .acct-active-banner { background: linear-gradient(135deg, #047857 0%, #065F46 100%); color: #fff; border-radius: 14px; padding: 28px 30px; margin-bottom: 18px; box-shadow: 0 6px 22px rgba(4,120,87,0.18); }
  .acct-active-banner h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; color: #fff; text-transform: none; }
  .acct-active-banner p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.92); }
  .acct-active-banner p:last-child { margin-bottom: 0; }
  .acct-active-banner .acct-active-meta { font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 12px; }

  .acct-inv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acct-inv-table th { text-align: left; font-weight: 600; color: var(--g6); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--g2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .acct-inv-table td { padding: 12px 8px 12px 0; border-bottom: 1px solid var(--g1); vertical-align: middle; }
  .acct-inv-table tr:last-child td { border-bottom: 0; }
  .acct-inv-table .acct-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  /* WCAG 2.5.5 (AAA target size). Inv/quote actions are inline text links;
     pad them up to a 44px effective target without breaking the inline
     flow of the cell. */
  .acct-inv-table .acct-actions a { color: var(--in); font-weight: 600; text-decoration: none; font-size: 12px; display: inline-flex; align-items: center; min-height: 44px; padding: 6px 0; }
  .acct-inv-table .acct-actions a:hover { text-decoration: underline; }
  .acct-inv-table .acct-actions a:focus-visible { outline: 2px solid var(--in); outline-offset: 2px; border-radius: 4px; }

  .acct-msg { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--in-l); border-radius: 10px; }
  .acct-msg-text { flex: 1; }
  .acct-msg-text strong { color: var(--in-d); }
  .acct-msg-text p { margin: 4px 0 0; color: var(--g6); font-size: 13px; line-height: 1.5; }
  .acct-msg-unread { background: var(--mg); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .acct-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--in); color: #fff; text-decoration: none; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .acct-btn:hover { background: var(--in-d); }
  .acct-btn-secondary { background: transparent; color: var(--in); border: 1px solid var(--in); }
  .acct-btn-secondary:hover { background: var(--in); color: #fff; }

  .acct-loading, .acct-empty { color: var(--g6); font-style: italic; padding: 12px 0; }
  .acct-error { background: var(--st-err-bg); border: 1px solid var(--st-err-bd); color: var(--st-err-fg); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; font-size: 13px; }
  .acct-foot { text-align: center; margin-top: 28px; color: var(--g6); font-size: 12px; line-height: 1.6; }
  .acct-foot a { color: var(--in); font-weight: 600; }

  /* Setup mode banner. DFY vs Guided framing sits above the tabs so the
     studio always understands which mode they're in. DFY = green-on-green,
     "we'll handle setup, just complete the items"; Guided = warm amber,
     "set up yourself, we're here if you get stuck." Hidden post-activation. */
  .acct-setup-banner { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; border-radius: 12px; margin-bottom: 18px; font-size: 13px; line-height: 1.55; }
  .acct-setup-banner-dfy { background: var(--st-ok-bg); color: var(--st-ok-fg); border: 1px solid #A7F3D0; }
  .acct-setup-banner-guided { background: var(--st-warn-bg); color: var(--st-warn-fg); border: 1px solid #FDE68A; }
  .acct-setup-banner-icon { font-size: 22px; line-height: 1; flex-shrink: 0; padding-top: 2px; }
  .acct-setup-banner-body strong { display: block; font-size: 14px; margin: 0 0 4px; letter-spacing: -0.1px; }

  /* Setup Checklist card. Lives at the top of the Home tab between
     "Where you're at" and "Request a change" so it's the first action
     surface. Tile grid is 1-up on mobile, 3-up on wide screens. */
  .acct-checklist-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; flex-wrap: wrap; }
  .acct-checklist-hdr h2 { margin: 0; }
  .acct-checklist-progress { font-size: 12px; color: var(--g6); font-weight: 600; }
  .acct-checklist-sub { color: var(--g6); font-size: 12px; line-height: 1.55; margin: 0 0 16px; max-width: 540px; }
  .acct-checklist-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .acct-checklist-grid { grid-template-columns: repeat(3, 1fr); } }
  .acct-tile { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--g1); border: 1px solid var(--g2); border-radius: 12px; text-align: left; font-family: inherit; cursor: pointer; min-height: 130px; transition: border-color 0.15s, background 0.15s; }
  .acct-tile:hover { border-color: var(--in); background: #fff; }
  .acct-tile:focus-visible { outline: 2px solid var(--in); outline-offset: 2px; }
  .acct-tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .acct-tile-icon { font-size: 22px; line-height: 1; }

  // a fresh /. Bound before any async loads so it works even if the
  // account fetch hangs.
  const signOutBtn = document.getElementById('acctSignOut');
  if (signOutBtn) {
    signOutBtn.addEventListener('click', function () {
      try { localStorage.removeItem(SESSION_KEY); } catch (_) { /* ignore */ }
      // Land on the OTP sign-in page rather than the public gate page.
      // From /setup/ the studio can immediately enter an email to re-auth
      // (their own or a different studio) without re-finding the welcome
      // email. href (not replace) so back-button still works.
      window.location.href = '/setup/';
    });
  }

  const SETUP_LABEL = { dfy: 'Done-For-You', guided: 'Guided self-setup' };

    unpaid: { cls: 'acct-pill-status-pending', label: 'Awaiting payment' },
    refunded: { cls: 'acct-pill-status-pending', label: 'Refunded' },
  };

  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (_) { return null; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function money(cents, currency) {
    if (cents == null) return '—';
    return (cents / 100).toLocaleString('en-AU', { style: 'currency', currency: currency || 'AUD' });
  }
  function dateFmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-AU', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function dateTimeFmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-AU', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function reviewUrlFor(sub) {
    if (!sub || !sub.plan || !sub.region) return null;
    return '/' + String(sub.region).toLowerCase() + '/' + sub.plan + '/';

  const TILE_STATUS_LABEL = {
    pending: 'Not started',
    submitted: 'Submitted, we\'re on it',
    no_account: 'We\'ll create it',
    in_progress: 'In progress',
    complete: 'Complete',
  };

  function renderSetupChecklistCard(sub, tasks) {
    if (!tasks || tasks.length === 0) return '';
    const completeCount = tasks.filter((t) => t.status === 'complete').length;
    const isGuided = sub.setup_type === 'guided';
    const sub_copy = isGuided
      ? 'Each tile walks you through one piece of your tech stack. Tap a tile to see what to do, plus what to paste back to us when you\'re done.'
      : 'Each tile lets you invite us into one of your accounts so we can set everything up for you. Tap a tile to see what we need.';
    return `
      <div class="acct-card">
        <div class="acct-checklist-hdr">
          <h2>Set up your accounts</h2>
          <div class="acct-checklist-progress">${completeCount} of ${tasks.length} complete</div>
        </div>
        <p class="acct-checklist-sub">${esc(sub_copy)}</p>
        <div class="acct-checklist-grid">
          ${tasks.map((t) => renderSetupTile(t)).join('')}
        </div>
      </div>`;
  }

  function renderSetupTile(task) {
    const meta = SETUP_SURFACES_META[task.surface];
    if (!meta) return '';
    const statusLabel = TILE_STATUS_LABEL[task.status] || 'Not started';
    return `
      <button type="button" class="acct-tile" data-setup-tile="${esc(task.surface)}" aria-label="Open ${esc(meta.name)} setup">
        <div class="acct-tile-top">
          <span class="acct-tile-icon" aria-hidden="true">${meta.icon}</span>
          <span class="acct-tile-pill acct-tile-pill-${esc(task.status)}">${esc(statusLabel)}</span>
        </div>
        <p class="acct-tile-name">${esc(meta.name)}</p>
        <p class="acct-tile-sub">${esc(meta.tagline)}</p>
      </button>`;
  }

  function openSetupTileModal(surface) {
    const task = (acctState.setupTasks || []).find((t) => t.surface === surface);
    const meta = SETUP_SURFACES_META[surface];
    if (!task || !meta) return;
    const sub = acctState.submission;
    const isGuided = sub.setup_type === 'guided';
    const isComplete = task.status === 'complete';
    const data = task.data || {};

    const copyTokensHtml = (meta.copyTokens || []).map((tk) => `
      <span class="acct-tile-copy-row">
        <span class="acct-tile-copy-label" style="color:var(--g6);">${esc(tk.label)}:</span>
        <code>${esc(tk.value)}</code>
        <button type="button" class="acct-tile-copy-btn" data-copy-value="${esc(tk.value)}">COPY</button>
      </span>`).join('');

    const steps = (isGuided ? meta.stepsGuided : meta.stepsDfy) || [];
    const whatWeDoHtml = isGuided
      ? `<div class="acct-tile-section">
           <h4>What this is for</h4>
           <p>${esc(meta.whatWeDo)}</p>
         </div>
         <div class="acct-tile-section">
           <h4>What you'll need before you start</h4>
           <p>${esc(meta.whatYouNeedForGuided || '')}</p>
         </div>`
      : `<div class="acct-tile-section">
           <h4>What we'll do for you</h4>
           <p>${esc(meta.whatWeDo)}</p>
         </div>`;

    const stepsTitle = isGuided ? 'How to set it up' : 'What we need from you';
    const stepsHtml = `
      <div class="acct-tile-section">
        <h4>${esc(stepsTitle)}</h4>
        ${copyTokensHtml ? `<div style="margin: 4px 0 10px;">${copyTokensHtml}</div>` : ''}
        <ol>${steps.map((s) => `<li>${s}</li>`).join('')}</ol>
      </div>`;

    const studioNameForTemplate = sub.studio_name || 'Your Studio';
    const fieldsHtml = meta.fields.map((f) => {
      const stored = data[f.key] != null ? String(data[f.key]) : '';
      // Pre-fill compliant SMS samples (and any other field with a
      // defaultTemplate) on first open. The studio can edit freely; once
      // they save anything, stored wins on subsequent opens.
      const val = (!stored && typeof f.defaultTemplate === 'function')
        ? f.defaultTemplate(studioNameForTemplate)
        : stored;
      const hint = f.hint ? `<span class="f-hint">${esc(f.hint)}</span>` : '';
      if (f.type === 'select') {
        const opts = (f.options || []).map((o) => `<option value="${esc(o.value)}"${val === o.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('');
        return `<div class="f"><label for="tile-f-${esc(f.key)}">${esc(f.label)}</label><select id="tile-f-${esc(f.key)}" data-field="${esc(f.key)}">${opts}</select>${hint}</div>`;
      }
      if (f.type === 'textarea') {
        const rows = f.defaultTemplate ? 3 : 2;
        return `<div class="f"><label for="tile-f-${esc(f.key)}">${esc(f.label)}</label><textarea id="tile-f-${esc(f.key)}" data-field="${esc(f.key)}" rows="${rows}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>${hint}</div>`;
      }
      return `<div class="f"><label for="tile-f-${esc(f.key)}">${esc(f.label)}</label><input type="${esc(f.type)}" id="tile-f-${esc(f.key)}" data-field="${esc(f.key)}" placeholder="${esc(f.placeholder || '')}" value="${esc(val)}">${hint}</div>`;
    }).join('');

    const noAccountChecked = task.status === 'no_account';

    const card = document.createElement('div');
    card.className = 'acct-modal-backdrop';
    card.id = 'setupTileModal';
    card.innerHTML = `
      <div class="acct-tile-modal-card" role="dialog" aria-modal="true" aria-labelledby="tileTitle">
        <div class="acct-modal-hdr">
          <h3 id="tileTitle">${meta.icon} ${esc(meta.name)}</h3>
          <button type="button" class="acct-modal-close" data-close-tile aria-label="Close">&times;</button>
        </div>
        ${isComplete
          ? `<p class="acct-modal-sub" style="color:var(--st-ok-fg);background:var(--st-ok-bg);padding:10px 14px;border-radius:8px;font-weight:600;">✓ This tile is complete. Nothing more to do here.</p>`
          : `<p class="acct-modal-sub">${esc(meta.tagline)}</p>`}
        ${whatWeDoHtml}
        ${stepsHtml}
        <div class="acct-tile-form" id="tileForm">
          ${fieldsHtml}
          <label class="acct-tile-noaccount">
            <input type="checkbox" id="tile-noaccount"${noAccountChecked ? ' checked' : ''}>
            ${esc(meta.noAccountLabel)}
          </label>
        </div>
        <div class="acct-modal-actions">
          <span class="acct-modal-err" id="tileErr"></span>
          <button type="button" class="acct-btn-secondary acct-btn" data-close-tile>Close</button>
          <button type="button" class="acct-btn" id="tileSaveBtn">Save and notify our team</button>
        </div>
      </div>`;
    document.body.appendChild(card);

    // Close handlers — backdrop click, close button, Esc key.
    function closeIt() {
      const m = document.getElementById('setupTileModal');
      if (m) m.remove();
      document.removeEventListener('keydown', onEsc);
    }
    function onEsc(e) { if (e.key === 'Escape') closeIt(); }
    card.addEventListener('click', (e) => {
      if (e.target === card) closeIt();
      if (e.target.closest('[data-close-tile]')) closeIt();
      const copyBtn = e.target.closest('[data-copy-value]');
      if (copyBtn) {
        const val = copyBtn.getAttribute('data-copy-value') || '';
        navigator.clipboard.writeText(val).then(() => {
          const orig = copyBtn.textContent;
          copyBtn.textContent = 'COPIED ✓';
          setTimeout(() => { copyBtn.textContent = orig; }, 1500);
        }).catch(() => { copyBtn.textContent = 'COPY FAILED'; });
      }
    });
    document.addEventListener('keydown', onEsc);

    // Save handler.
    document.getElementById('tileSaveBtn').addEventListener('click', async () => {
      const session = readSession();
      if (!session || !session.token) {
        document.getElementById('tileErr').textContent = 'Your session expired. Refresh the page and try again.';
        return;
      }
      const form = document.getElementById('tileForm');
      const noAccountFlag = !!form.querySelector('#tile-noaccount').checked;
      const status = noAccountFlag ? 'no_account' : 'submitted';
      const dataOut = {};
      if (!noAccountFlag) {
        form.querySelectorAll('[data-field]').forEach((el) => {
          dataOut[el.getAttribute('data-field')] = el.value || '';
        });
        // Require at least one identifier field. Notes alone isn't enough.
        const idKeys = meta.fields.filter((f) => f.key !== 'notes').map((f) => f.key);
        const anyId = idKeys.some((k) => String(dataOut[k] || '').trim().length > 0);
        if (!anyId) {
          document.getElementById('tileErr').textContent = 'Add at least one identifier above, or tick "I don\'t have this yet".';
          return;
        }
      }
      const btn = document.getElementById('tileSaveBtn');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';
      document.getElementById('tileErr').textContent = '';
      try {
        const r = await fetch(FN_BASE + 'studio-save-setup-task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_token: session.token, surface, status, data: dataOut }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) {
          document.getElementById('tileErr').textContent = j.error || 'Something went wrong. Try again.';
          btn.disabled = false;
          btn.textContent = origText;
          return;
        }
        // Patch local state, re-render, close.
        const list = acctState.setupTasks || [];
        const idx = list.findIndex((t) => t.surface === surface);
        if (idx >= 0) list[idx] = j.task;
        else list.push(j.task);
        acctState.setupTasks = list;
        closeIt();
        renderAccount({
          submission: acctState.submission,
          invoices: acctState.invoices,
          quotes: acctState.quotes,
          service_requests: acctState.requests,
          setup_tasks: acctState.setupTasks,
          conversation: acctState.conv,
        });
      } catch (err) {
        document.getElementById('tileErr').textContent = 'Network error. Try again in a moment.';
        btn.disabled = false;
        btn.textContent = origText;
      }
    });
  }

  function bindSetupTileHandlers() {
    document.querySelectorAll('[data-setup-tile]').forEach((el) => {
      el.addEventListener('click', () => openSetupTileModal(el.getAttribute('data-setup-tile')));
    });
  }

  function renderAccount(data) {
    const sub = data.submission;
    const invoices = data.invoices || [];
    const conv = data.conversation || {};
    const reviewUrl = reviewUrlFor(sub);
    const statusPill = STATUS_PILL[sub.payment_status] || STATUS_PILL.pending;
    const fullName = [sub.first_name, sub.last_name].filter(Boolean).join(' ');
    const isPaid = sub.payment_status === 'paid'
      || sub.payment_status === 'authorised'
      || sub.payment_status === 'card_saved';

    if (!isPaid) {
      renderNotPaidYet(sub);
      return;
    }

    // Four-stage status block. Plan-agnostic structure (have / doing /
     // need / next), with copy tweaked for AI vs Launch+Scale because the
     // turnaround windows differ. No prediction of GHL platform steps —
     // that's out of scope here; communication moves to the platform itself
     // once admin activates the account.
    const stages = sub.plan === 'ai'
      ? [
        { label: 'What we have', body: 'Your studio details, branding, and payment. Everything\'s in.' },
        { label: 'What we\'re doing now', body: 'Setting up and testing your AI voice and chat agents against your studio data. Most studios are live within 7 to 10 business days.' },
        { label: 'What we\'ll need from you', body: 'Nothing right now. If anything needs clarifying, we\'ll send you a message below, and you\'ll also get an email.' },
        { label: 'What happens next', body: 'You\'ll receive a welcome email with your login the moment your AI is ready to go live.' },
      ]
      : [
        { label: 'What we have', body: 'Your studio details, branding, and payment. Everything we need to start.' },
        { label: 'What we\'re doing now', body: 'Reviewing your submission and setting up your account behind the scenes. Most studios are live within 3 to 5 business days.' },
        { label: 'What we\'ll need from you', body: 'Nothing right now. If anything needs clarifying, we\'ll send you a message below, and you\'ll also get an email.' },
        { label: 'What happens next', body: 'You\'ll receive a welcome email with your login the moment your account is ready to go live.' },
      ];

    const invoiceRows = invoices.map((inv) => `
      <tr>
        <td>${esc(inv.number || '—')}</td>
        <td>${esc(inv.kind === 'setup_invoice' ? 'Setup' : inv.kind === 'custom_charge' ? 'Add-on' : inv.kind === 'quote_invoice' ? 'Quote' : 'Credit')}</td>
        <td><span class="acct-pill ${inv.status === 'paid' ? 'acct-pill-status-paid' : 'acct-pill-status-pending'}">${esc(inv.status === 'paid' ? 'Paid' : inv.status === 'voided' ? 'Voided' : inv.status === 'refunded' ? 'Refunded' : 'Open')}</span></td>
        <td>${esc(money(inv.total_cents, inv.currency))}</td>
        <td>${esc(dateFmt(inv.issued_at))}</td>
        <td class="acct-actions">
          ${inv.hosted_url ? `<a href="${esc(inv.hosted_url)}" target="_blank" rel="noopener">View invoice</a>` : ''}
          ${inv.pdf_url ? `<a href="${esc(inv.pdf_url)}" target="_blank" rel="noopener">PDF</a>` : ''}
        </td>
      </tr>
    `).join('');

    // Quotes are surfaced separately from invoices so the studio can see
    // pending offers and their expiry. Accepted quotes generate an invoice
    // (kind='quote_invoice') which appears in the Invoices section above.
    const quotes = data.quotes || [];
    const quotesPillClass = (s) =>
      s === 'accepted' ? 'acct-pill-status-paid'
      : s === 'cancelled' || s === 'declined' ? 'acct-pill-status-crit'
      : s === 'expired' || s === 'revised' ? 'acct-pill-status-muted'
      : 'acct-pill-status-info'; // sent / viewed / draft
    const quotesPillLabel = (s) =>
      s === 'sent' ? 'Awaiting your reply'
      : s === 'viewed' ? 'Viewed'
      : s === 'accepted' ? 'Accepted'
      : s === 'declined' ? 'Declined'
      : s === 'expired' ? 'Expired'
      : s === 'cancelled' ? 'Cancelled'
      : 'Draft';
    const quotesDaysLeft = (iso, status) => {
      if (!iso) return '';
      if (status === 'accepted' || status === 'declined' || status === 'expired' || status === 'cancelled') {
        return dateFmt(iso);
      }
      const days = Math.ceil((new Date(iso).getTime() - Date.now()) / (24 * 60 * 60 * 1000));
      if (days <= 0) return 'Expired';
      if (days === 1) return '1 day left';
      return `${days} days left`;
    };
    const quoteRows = quotes.map((q) => `
      <tr>
        <td>${esc(q.number || '—')}</td>
        <td><span class="acct-pill ${quotesPillClass(q.status)}">${esc(quotesPillLabel(q.status))}</span></td>
        <td>${esc(money(q.total_cents, q.currency))}</td>
        <td>${esc(quotesDaysLeft(q.expires_at, q.status))}</td>
        <td class="acct-actions">
          <a href="#" data-q-pdf="${esc(q.id)}">Download PDF</a>
        </td>
      </tr>
    `).join('');

    // Stash the latest server view of the submission so onSaveSection
    // can build patch payloads and rerender locked-row recap without
    // refetching. Replaced on every successful save.
    acctState.submission = sub;
    acctState.invoices = invoices;
    acctState.quotes = quotes;
    acctState.requests = data.service_requests || [];
    acctState.setupTasks = data.setup_tasks || acctState.setupTasks || [];
    acctState.conv = conv;
    acctState.fullName = fullName;
    acctState.statusPill = statusPill;
    acctState.stages = stages;
    acctState.editing = acctState.editing || {};

    const isActive = sub.status === 'active';

    // Inline thread + composer. Hidden once status='active' since the
    // studio's primary surface is the GHL platform from that point on.
    // Attachment chips render under the textarea — selected files are
    // uploaded immediately after the message is sent, mirroring
    // portal.html's two-step pattern.
    const messagesBlock = `

          <span class="acct-compose-hint" style="flex:1;min-width:120px;">Cmd/Ctrl-Enter to send.</span>

    const activationBanner = isActive
