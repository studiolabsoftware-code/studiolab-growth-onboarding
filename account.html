<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your account — StudioLAB Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Local semantic-status tokens. Mirrors the admin pill palette so studio
     and admin views read identically for paid / authorised / card_saved /
     pending / info / crit / muted statuses. */
  :root {
    --st-ok-fg:    #047857;  --st-ok-bg:    #D1FAE5;
    --st-warn-fg:  #B45309;  --st-warn-bg:  #FEF3C7;
    --st-info-fg:  #1E40AF;  --st-info-bg:  #DBEAFE;
    --st-crit-fg:  #B91C1C;  --st-crit-bg:  #FEE2E2;
    --st-err-fg:   #991B1B;  --st-err-bg:   #FEF2F2;  --st-err-bd: #FCA5A5;
  }
  .acct-wrap { max-width: 880px; margin: 32px auto 80px; padding: 0 16px; }
  .acct-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .acct-hdr h1 { font-size: 26px; font-weight: 800; color: var(--in-d); margin: 0 0 4px; letter-spacing: -0.4px; }
  .acct-hdr .acct-sub { color: var(--g6); font-size: 14px; }
  .acct-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acct-pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .acct-pill-plan { background: var(--in-l); color: var(--in-d); }
  .acct-pill-status-paid { background: var(--st-ok-bg); color: var(--st-ok-fg); }
  .acct-pill-status-authorised { background: var(--st-warn-bg); color: var(--st-warn-fg); }
  .acct-pill-status-card_saved { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-pill-status-pending { background: var(--g2); color: var(--g6); }
  /* Quote-specific pill variants. Sent/Viewed = info blue. Cancelled/
     Declined = red. Expired/Revised = neutral grey. */
  .acct-pill-status-info { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-pill-status-crit { background: var(--st-crit-bg); color: var(--st-crit-fg); }
  .acct-pill-status-muted { background: var(--g2); color: var(--g6); }

  .acct-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(19,16,46,.06); padding: 22px 24px; margin-bottom: 18px; }
  .acct-card h2 { font-size: 14px; font-weight: 700; color: var(--g6); margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.6px; }
  .acct-card .acct-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--g1); font-size: 13px; }
  .acct-card .acct-row:last-child { border-bottom: 0; }
  .acct-card .acct-k { width: 160px; flex-shrink: 0; color: var(--g6); }
  .acct-card .acct-v { color: var(--in-d); }
  .acct-card .acct-v a { color: var(--in); text-decoration: none; font-weight: 600; }

  .acct-next ol { margin: 0; padding-left: 20px; color: var(--in-d); }
  .acct-next li { margin-bottom: 8px; line-height: 1.55; }
  /* "What happens next" upgraded layout — a four-step status block that
     reads as a definition list rather than a numbered queue, so the studio
     understands what we have, what we're doing, what we need from them,
     and what happens at the end. Plan-agnostic copy lives in JS. */
  .acct-stages { display: grid; gap: 14px; }
  .acct-stage { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: flex-start; }
  .acct-stage-icon { width: 28px; height: 28px; border-radius: 999px; background: var(--in-l); color: var(--in-d); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .acct-stage-label { font-size: 13px; font-weight: 700; color: var(--in-d); margin: 4px 0 2px; }
  .acct-stage-body { font-size: 13px; line-height: 1.55; color: var(--g6); }

  /* Inline message thread + composer. Replaces the old "reply to email"
     dead-end with a directly-usable thread on the account page itself.
     Mirrors portal.html visual idiom but compacted for embed. */
  .acct-thread { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px 2px; margin-bottom: 14px; scrollbar-gutter: stable; }
  .acct-thread-empty { color: var(--g6); font-style: italic; text-align: center; padding: 28px 12px; font-size: 13px; }
  .acct-thread-loading { color: var(--g6); font-style: italic; padding: 12px 0; font-size: 13px; }
  .acct-msg-bubble { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
  .acct-msg-bubble .acct-msg-meta { font-size: 11px; color: var(--g6); margin-bottom: 4px; font-weight: 600; }
  .acct-msg-bubble .acct-msg-body { color: var(--in-d); }
  .acct-msg-bubble .acct-msg-body p { margin: 0 0 6px; }
  .acct-msg-bubble .acct-msg-body p:last-child { margin-bottom: 0; }
  .acct-msg-bubble .acct-msg-body a { color: var(--in); }
  .acct-msg-mine { align-self: flex-end; background: var(--in); color: #fff; }
  .acct-msg-mine .acct-msg-meta { color: rgba(255,255,255,0.85); }
  .acct-msg-mine .acct-msg-body { color: #fff; }
  .acct-msg-mine .acct-msg-body a { color: #fff; text-decoration: underline; }
  .acct-msg-them { align-self: flex-start; background: var(--g1); }
  .acct-msg-system { align-self: center; background: transparent; padding: 4px 12px; color: var(--g6); font-size: 12px; font-style: italic; }
  .acct-msg-system .acct-msg-body { color: var(--g6); }

  .acct-compose { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--g1); padding-top: 14px; }
  .acct-compose textarea { width: 100%; min-height: 80px; padding: 12px 14px; border: 1px solid var(--g2); border-radius: 10px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: vertical; color: var(--in-d); background: #fff; }
  .acct-compose textarea:focus { outline: 2px solid var(--in); outline-offset: 1px; border-color: var(--in); }
  .acct-compose-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .acct-compose-hint { color: var(--g6); font-size: 12px; flex: 1; min-width: 200px; }
  .acct-compose-hint a { color: var(--in); font-weight: 600; }
  .acct-compose-err { color: var(--st-err-fg); font-size: 12px; }
  .acct-compose button { min-width: 96px; }
  .acct-compose button[disabled] { opacity: 0.55; cursor: not-allowed; }

  .acct-inv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acct-inv-table th { text-align: left; font-weight: 600; color: var(--g6); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--g2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .acct-inv-table td { padding: 12px 8px 12px 0; border-bottom: 1px solid var(--g1); vertical-align: middle; }
  .acct-inv-table tr:last-child td { border-bottom: 0; }
  .acct-inv-table .acct-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  /* WCAG 2.5.5 (AAA target size). Inv/quote actions are inline text links;
     pad them up to a 44px effective target without breaking the inline
     flow of the cell. */
  .acct-inv-table .acct-actions a { color: var(--in); font-weight: 600; text-decoration: none; font-size: 12px; display: inline-flex; align-items: center; min-height: 44px; padding: 6px 0; }
  .acct-inv-table .acct-actions a:hover { text-decoration: underline; }
  .acct-inv-table .acct-actions a:focus-visible { outline: 2px solid var(--in); outline-offset: 2px; border-radius: 4px; }

  .acct-msg { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--in-l); border-radius: 10px; }
  .acct-msg-text { flex: 1; }
  .acct-msg-text strong { color: var(--in-d); }
  .acct-msg-text p { margin: 4px 0 0; color: var(--g6); font-size: 13px; line-height: 1.5; }
  .acct-msg-unread { background: var(--mg); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .acct-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--in); color: #fff; text-decoration: none; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .acct-btn:hover { background: var(--in-d); }
  .acct-btn-secondary { background: transparent; color: var(--in); border: 1px solid var(--in); }
  .acct-btn-secondary:hover { background: var(--in); color: #fff; }

  .acct-loading, .acct-empty { color: var(--g6); font-style: italic; padding: 12px 0; }
  .acct-error { background: var(--st-err-bg); border: 1px solid var(--st-err-bd); color: var(--st-err-fg); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; font-size: 13px; }
  .acct-foot { text-align: center; margin-top: 28px; color: var(--g6); font-size: 12px; line-height: 1.6; }
  .acct-foot a { color: var(--in); font-weight: 600; }
</style>
<link rel="icon" type="image/png" href="/assets/studiolab-icon.png">
<link rel="apple-touch-icon" href="/assets/studiolab-icon.png">
<link rel="shortcut icon" href="/assets/studiolab-icon.png">
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a class="hdr-logo" href="/" aria-label="StudioLAB Growth — account setup">
      <img src="assets/growth-logo-white.svg" alt="StudioLAB Growth">
    </a>
    <div class="hdr-div" aria-hidden="true"></div>
    <div class="hdr-sub" aria-hidden="true">Your account</div>
    <div style="flex:1;"></div>
    <button type="button" id="acctSignOut" style="background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Sign out</button>
  </div>
</header>

<main>
  <div class="acct-wrap" id="acctRoot">
    <div class="acct-loading">Loading your account…</div>
  </div>
</main>

<script src="js/supabase-config.js?v=20260514a"></script>
<script>
(function () {
  'use strict';
  const FN_BASE = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url) + '/functions/v1/';
  const SESSION_KEY = 'sl-growth-session';

  // Sign out — clears the studio session from localStorage and bounces to
  // a fresh /. Bound before any async loads so it works even if the
  // account fetch hangs.
  const signOutBtn = document.getElementById('acctSignOut');
  if (signOutBtn) {
    signOutBtn.addEventListener('click', function () {
      try { localStorage.removeItem(SESSION_KEY); } catch (_) { /* ignore */ }
      // Land on the OTP sign-in page rather than the public gate page.
      // From /setup/ the studio can immediately enter an email to re-auth
      // (their own or a different studio) without re-finding the welcome
      // email. href (not replace) so back-button still works.
      window.location.href = '/setup/';
    });
  }
  const PLAN_LABEL = { launch: 'Launch', scale: 'Scale', ai: 'Dominate AI' };
  const SETUP_LABEL = { dfy: 'Done-For-You', guided: 'Guided self-setup' };
  const STATUS_PILL = {
    paid: { cls: 'acct-pill-status-paid', label: 'Paid' },
    authorised: { cls: 'acct-pill-status-authorised', label: 'Card authorised' },
    card_saved: { cls: 'acct-pill-status-card_saved', label: 'Card saved' },
    pending: { cls: 'acct-pill-status-pending', label: 'Awaiting payment' },
    unpaid: { cls: 'acct-pill-status-pending', label: 'Awaiting payment' },
    refunded: { cls: 'acct-pill-status-pending', label: 'Refunded' },
  };

  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (_) { return null; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function money(cents, currency) {
    if (cents == null) return '—';
    return (cents / 100).toLocaleString('en-AU', { style: 'currency', currency: currency || 'AUD' });
  }
  function dateFmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-AU', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function dateTimeFmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-AU', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function reviewUrlFor(sub) {
    if (!sub || !sub.plan || !sub.region) return null;
    return '/' + String(sub.region).toLowerCase() + '/' + sub.plan + '/';
  }

  function renderError(message) {
    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-error">${esc(message)}</div>
      <div class="acct-foot">
        Need help? Email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a> and we'll sort it.
      </div>`;
  }

  function renderNotPaidYet(sub) {
    const reviewUrl = reviewUrlFor(sub);
    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-hdr">
        <div>
          <h1>Welcome ${sub.studio_name ? 'back, ' + esc(sub.studio_name) : 'back'}</h1>
          <div class="acct-sub">Your setup is in progress. Pick up where you left off.</div>
        </div>
        <div class="acct-pills">
          <span class="acct-pill acct-pill-plan">${esc(PLAN_LABEL[sub.plan] || sub.plan || 'Setup')}</span>
          <span class="acct-pill acct-pill-status-pending">${esc(STATUS_PILL[sub.payment_status]?.label || 'In progress')}</span>
        </div>
      </div>
      <div class="acct-card">
        <h2>Pick up your setup</h2>
        <p style="margin:0 0 14px;color:var(--g6);font-size:13px;line-height:1.55;">
          Your progress is saved. Continue from where you left off — you won't lose anything.
        </p>
        ${reviewUrl ? `<a class="acct-btn" href="${esc(reviewUrl)}">Continue setup →</a>` : ''}
      </div>
      <div class="acct-foot">
        Need help? Email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a> with your studio name.
      </div>`;
  }

  function renderAccount(data) {
    const sub = data.submission;
    const invoices = data.invoices || [];
    const conv = data.conversation || {};
    const reviewUrl = reviewUrlFor(sub);
    const statusPill = STATUS_PILL[sub.payment_status] || STATUS_PILL.pending;
    const fullName = [sub.first_name, sub.last_name].filter(Boolean).join(' ');
    const isPaid = sub.payment_status === 'paid'
      || sub.payment_status === 'authorised'
      || sub.payment_status === 'card_saved';

    if (!isPaid) {
      renderNotPaidYet(sub);
      return;
    }

    // Four-stage status block. Plan-agnostic structure (have / doing /
     // need / next), with copy tweaked for AI vs Launch+Scale because the
     // turnaround windows differ. No prediction of GHL platform steps —
     // that's out of scope here; communication moves to the platform itself
     // once admin activates the account.
    const stages = sub.plan === 'ai'
      ? [
        { label: 'What we have', body: 'Your studio details, branding, knowledge base, and payment. Everything\'s in.' },
        { label: 'What we\'re doing now', body: 'Reviewing your knowledge base and tuning your AI voice and chat agents to match your studio. This typically takes 7–10 business days.' },
        { label: 'What we\'ll need from you', body: 'Nothing right now. If we have follow-up questions on your knowledge base, we\'ll send you a message below — you\'ll also get an email.' },
        { label: 'What happens next', body: 'You\'ll receive a welcome email with your login the moment your AI is ready to go live.' },
      ]
      : [
        { label: 'What we have', body: 'Your studio details, branding, and payment. Everything we need to start.' },
        { label: 'What we\'re doing now', body: 'Reviewing your submission and setting up your account behind the scenes. This typically takes 1–2 business days.' },
        { label: 'What we\'ll need from you', body: 'Nothing right now. If anything needs clarifying, we\'ll send you a message below — you\'ll also get an email.' },
        { label: 'What happens next', body: 'You\'ll receive a welcome email with your login the moment your account is ready to go live.' },
      ];

    const invoiceRows = invoices.map((inv) => `
      <tr>
        <td>${esc(inv.number || '—')}</td>
        <td>${esc(inv.kind === 'setup_invoice' ? 'Setup' : inv.kind === 'custom_charge' ? 'Add-on' : inv.kind === 'quote_invoice' ? 'Quote' : 'Credit')}</td>
        <td><span class="acct-pill ${inv.status === 'paid' ? 'acct-pill-status-paid' : 'acct-pill-status-pending'}">${esc(inv.status === 'paid' ? 'Paid' : inv.status === 'voided' ? 'Voided' : inv.status === 'refunded' ? 'Refunded' : 'Open')}</span></td>
        <td>${esc(money(inv.total_cents, inv.currency))}</td>
        <td>${esc(dateFmt(inv.issued_at))}</td>
        <td class="acct-actions">
          ${inv.hosted_url ? `<a href="${esc(inv.hosted_url)}" target="_blank" rel="noopener">View invoice</a>` : ''}
          ${inv.pdf_url ? `<a href="${esc(inv.pdf_url)}" target="_blank" rel="noopener">PDF</a>` : ''}
        </td>
      </tr>
    `).join('');

    // Quotes are surfaced separately from invoices so the studio can see
    // pending offers and their expiry. Accepted quotes generate an invoice
    // (kind='quote_invoice') which appears in the Invoices section above.
    const quotes = data.quotes || [];
    const quotesPillClass = (s) =>
      s === 'accepted' ? 'acct-pill-status-paid'
      : s === 'cancelled' || s === 'declined' ? 'acct-pill-status-crit'
      : s === 'expired' || s === 'revised' ? 'acct-pill-status-muted'
      : 'acct-pill-status-info'; // sent / viewed / draft
    const quotesPillLabel = (s) =>
      s === 'sent' ? 'Awaiting your reply'
      : s === 'viewed' ? 'Viewed'
      : s === 'accepted' ? 'Accepted'
      : s === 'declined' ? 'Declined'
      : s === 'expired' ? 'Expired'
      : s === 'cancelled' ? 'Cancelled'
      : 'Draft';
    const quotesDaysLeft = (iso, status) => {
      if (!iso) return '';
      if (status === 'accepted' || status === 'declined' || status === 'expired' || status === 'cancelled') {
        return dateFmt(iso);
      }
      const days = Math.ceil((new Date(iso).getTime() - Date.now()) / (24 * 60 * 60 * 1000));
      if (days <= 0) return 'Expired';
      if (days === 1) return '1 day left';
      return `${days} days left`;
    };
    const quoteRows = quotes.map((q) => `
      <tr>
        <td>${esc(q.number || '—')}</td>
        <td><span class="acct-pill ${quotesPillClass(q.status)}">${esc(quotesPillLabel(q.status))}</span></td>
        <td>${esc(money(q.total_cents, q.currency))}</td>
        <td>${esc(quotesDaysLeft(q.expires_at, q.status))}</td>
        <td class="acct-actions">
          <a href="#" data-q-pdf="${esc(q.id)}">Download PDF</a>
        </td>
      </tr>
    `).join('');

    // Inline thread + composer. The DOM is rendered now; loadThread()
    // hydrates it after the page paints so the rest of the account view
    // stays interactive while messages are fetching.
    const messagesBlock = `
      <div class="acct-thread" id="acctThread">
        <div class="acct-thread-loading">Loading your conversation…</div>
      </div>
      <form class="acct-compose" id="acctCompose" novalidate>
        <textarea id="acctMsgBody" rows="3" placeholder="Type a message to our team… (Cmd/Ctrl-Enter to send)" maxlength="10000"></textarea>
        <div class="acct-compose-bar">
          <span class="acct-compose-hint">
            Need to send a file? <a href="${esc(conv.portal_url || '#')}">Open the full thread</a> to attach PDFs or images.
          </span>
          <span class="acct-compose-err" id="acctMsgErr" role="alert"></span>
          <button type="submit" class="acct-btn" id="acctMsgSend">Send</button>
        </div>
      </form>`;

    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-hdr">
        <div>
          <h1>${sub.studio_name ? esc(sub.studio_name) : 'Your account'}</h1>
          <div class="acct-sub">${esc(fullName || sub.contact_email || '')}</div>
        </div>
        <div class="acct-pills">
          <span class="acct-pill acct-pill-plan">${esc(PLAN_LABEL[sub.plan] || sub.plan)}</span>
          <span class="acct-pill ${statusPill.cls}">${esc(statusPill.label)}</span>
        </div>
      </div>

      <div class="acct-card">
        <h2>Where you're at</h2>
        <div class="acct-stages">
          ${stages.map((s, i) => `
            <div class="acct-stage">
              <div class="acct-stage-icon" aria-hidden="true">${i + 1}</div>
              <div>
                <div class="acct-stage-label">${esc(s.label)}</div>
                <div class="acct-stage-body">${esc(s.body)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>

      <div class="acct-card">
        <h2>Messages with our team</h2>
        ${messagesBlock}
      </div>

      <div class="acct-card">
        <h2>Invoices</h2>
        ${invoices.length === 0
          ? '<div class="acct-empty">No invoices yet. Your setup invoice will appear here shortly after payment.</div>'
          : `<table class="acct-inv-table">
              <thead>
                <tr><th>Number</th><th>Kind</th><th>Status</th><th>Amount</th><th>Issued</th><th>Actions</th></tr>
              </thead>
              <tbody>${invoiceRows}</tbody>
            </table>`
        }
      </div>

      <div class="acct-card">
        <h2>Quotes</h2>
        ${quotes.length === 0
          ? '<div class="acct-empty">No quotes yet. If our team sends you one, it will appear here so you can track its status.</div>'
          : `<table class="acct-inv-table">
              <thead>
                <tr><th>Number</th><th>Status</th><th>Amount</th><th>Expires</th><th>Actions</th></tr>
              </thead>
              <tbody>${quoteRows}</tbody>
            </table>
            <p style="margin:14px 0 0;color:var(--g6);font-size:12px;line-height:1.55;">
              You'll receive your quote by email from Stripe. Use the link in that email to view and accept. Accepting creates an invoice with a Pay link, which will also appear in your Invoices above.
            </p>`}
      </div>

      <div class="acct-card">
        <h2>Your submission</h2>
        <div class="acct-row"><div class="acct-k">Plan</div><div class="acct-v">${esc(PLAN_LABEL[sub.plan] || sub.plan)} · ${esc(SETUP_LABEL[sub.setup_type] || sub.setup_type)}</div></div>
        <div class="acct-row"><div class="acct-k">Studio name</div><div class="acct-v">${esc(sub.studio_name || '—')}</div></div>
        <div class="acct-row"><div class="acct-k">Primary contact</div><div class="acct-v">${esc(fullName || '—')}${sub.contact_email ? ' · <a href="mailto:' + esc(sub.contact_email) + '">' + esc(sub.contact_email) + '</a>' : ''}</div></div>
        <div class="acct-row"><div class="acct-k">Country / timezone</div><div class="acct-v">${esc(sub.country || '—')}${sub.timezone ? ' · ' + esc(sub.timezone) : ''}</div></div>
        <div class="acct-row"><div class="acct-k">Submitted</div><div class="acct-v">${esc(dateTimeFmt(sub.submitted_at))}</div></div>
        <div class="acct-row"><div class="acct-k">Need to update something?</div><div class="acct-v">Send us a message above and tell us what to change — we'll update your record on our side.</div></div>
      </div>

      <div class="acct-foot">
        Need to reach us? Send a message above, or email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a>.
      </div>`;

    // Hydrate the inline message thread + composer. Kicked off after the
    // main render so the rest of the page is usable while messages load.
    // Stash sender name/email globally so onMsgSend can stamp messages
    // without re-resolving from state — the inline composer is a sibling
    // of renderAccount's closure, not a child of it.
    window.__acctSenderName = fullName || sub.studio_name || null;
    window.__acctSenderEmail = sub.contact_email || null;
    initMessages(conv);

    // PDF download handler — POSTs the session_token in the request body
    // to keep it off the URL bar and server logs. Streams the PDF back as
    // a Blob and triggers a download with the quote number as filename.
    document.getElementById('acctRoot').addEventListener('click', async (e) => {
      const a = e.target.closest('[data-q-pdf]');
      if (!a) return;
      e.preventDefault();
      const quoteId = a.getAttribute('data-q-pdf');
      const session = readSession();
      if (!session || !session.token) {
        alert('Your session has expired. Please verify your email again.');
        return;
      }
      try {
        const resp = await fetch(FN_BASE + 'get-quote-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quote_id: quoteId, session_token: session.token }),
        });
        if (!resp.ok) {
          const j = await resp.json().catch(() => ({}));
          alert((j && j.error) || 'Could not download your quote. Please try again, or reply to your confirmation email if the issue continues.');
          return;
        }
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const tmp = document.createElement('a');
        tmp.href = objUrl;
        // Pull the quote number from the matched row for the filename.
        const numCell = a.closest('tr')?.firstElementChild?.textContent?.trim();
        tmp.download = (numCell && numCell !== '—' ? numCell : 'quote') + '.pdf';
        document.body.appendChild(tmp);
        tmp.click();
        tmp.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
      } catch (err) {
        console.error('quote pdf download failed', err);
        alert('We could not reach the server. Check your connection and try again.');
      }
    });
  }

  // ------------------------------------------------------------------
  // Inline messages — thread + composer hydration. Auths against
  // portal-conversation using the conversation_id + studio_token returned
  // by get-studio-account (both always exist now; the loader mints them
  // if they don't already). Polls every 15s while the tab is visible so
  // admin replies render without a manual refresh. We can't use Supabase
  // realtime here because messages has admin-only RLS and the studio has
  // no JWT — polling matches the existing portal.html pattern.
  const msgState = { convId: null, token: null, sending: false, pollTimer: null };

  function initMessages(conv) {
    if (!conv || !conv.id || !conv.token) {
      const thread = document.getElementById('acctThread');
      if (thread) thread.innerHTML = '<div class="acct-thread-empty">We could not load your conversation. Please refresh the page.</div>';
      return;
    }
    msgState.convId = conv.id;
    msgState.token = conv.token;

    const form = document.getElementById('acctCompose');
    const body = document.getElementById('acctMsgBody');
    if (form) form.addEventListener('submit', onMsgSend);
    if (body) {
      body.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    }

    loadThread(true).then(() => markThreadRead());
    startMsgPolling();
  }

  async function msgApi(action, extra) {
    const resp = await fetch(FN_BASE + 'portal-conversation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action,
        conversation_id: msgState.convId,
        token: msgState.token,
        ...(extra || {}),
      }),
    });
    let data = null;
    try { data = await resp.json(); } catch (_) { /* ignore */ }
    return { ok: resp.ok && data?.ok !== false, status: resp.status, data };
  }

  async function loadThread(scroll) {
    const res = await msgApi('load');
    const host = document.getElementById('acctThread');
    if (!host) return;
    if (!res.ok) {
      host.innerHTML = '<div class="acct-thread-empty">We could not load your conversation. Please refresh.</div>';
      return;
    }
    const messages = res.data?.messages || [];
    if (!messages.length) {
      host.innerHTML = '<div class="acct-thread-empty">No messages yet — say hello below and we will get back to you shortly.</div>';
      return;
    }
    host.innerHTML = messages.map(renderThreadMsg).join('');
    if (scroll) host.scrollTop = host.scrollHeight;
  }

  function renderThreadMsg(m) {
    const isStudio = m.sender_role === 'studio';
    const isSystem = m.sender_role === 'system';
    const cls = isSystem
      ? 'acct-msg-bubble acct-msg-system'
      : (isStudio ? 'acct-msg-bubble acct-msg-mine' : 'acct-msg-bubble acct-msg-them');
    const who = isSystem ? '' : (isStudio ? (m.sender_name || 'You') : (m.sender_name || 'StudioLAB Growth'));
    const ts = new Date(m.created_at).toLocaleString('en-AU', {
      dateStyle: 'medium', timeStyle: 'short', timeZone: 'Australia/Sydney',
    });
    const bodyHtml = m.body_html || textToHtml(m.body_text || '');
    if (isSystem) {
      return `<div class="${cls}"><div class="acct-msg-body">${bodyHtml} · ${esc(ts)}</div></div>`;
    }
    return `
      <div class="${cls}">
        <div class="acct-msg-meta">${esc(who)} · ${esc(ts)}</div>
        <div class="acct-msg-body">${bodyHtml}</div>
      </div>`;
  }

  // Plain-text → minimal HTML for client-side rendering of any message
  // that didn't ship body_html (system events, legacy rows). Server-side
  // textToHtml in portal-conversation does the heavier lifting for new
  // studio sends; this is just a render fallback.
  function textToHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  async function onMsgSend(e) {
    e.preventDefault();
    if (msgState.sending) return;
    const errEl = document.getElementById('acctMsgErr');
    const sendBtn = document.getElementById('acctMsgSend');
    const bodyEl = document.getElementById('acctMsgBody');
    errEl.textContent = '';
    const text = (bodyEl.value || '').trim();
    if (!text) { errEl.textContent = 'Type a message first.'; return; }
    if (text.length > 10000) { errEl.textContent = 'Message is too long (max 10,000 characters).'; return; }

    msgState.sending = true;
    sendBtn.disabled = true;
    const senderName = window.__acctSenderName || null;
    const senderEmail = window.__acctSenderEmail || null;
    const res = await msgApi('send', { body_text: text, sender_name: senderName, sender_email: senderEmail });
    msgState.sending = false;
    sendBtn.disabled = false;
    if (!res.ok) {
      errEl.textContent = (res.data && res.data.error) || 'Could not send. Please try again.';
      return;
    }
    bodyEl.value = '';
    await loadThread(true);
  }

  async function markThreadRead() {
    try { await msgApi('mark-read'); } catch (_) { /* best effort */ }
  }

  function startMsgPolling() {
    if (msgState.pollTimer) return;
    msgState.pollTimer = setInterval(() => {
      if (document.hidden) return;
      // Preserve scroll position unless the user is already at the bottom.
      const host = document.getElementById('acctThread');
      if (!host) return;
      const wasAtBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 40;
      loadThread(wasAtBottom);
    }, 15000);
  }

  async function load() {
    const session = readSession();
    if (!session || !session.token) {
      renderError('You will need to verify your email again to see your account. Open your most recent email from us and click the setup link.');
      return;
    }

    try {
      const resp = await fetch(FN_BASE + 'get-studio-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: session.token }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        renderError((data && data.error) || 'Could not load your account. Please try again in a moment.');
        return;
      }
      renderAccount(data);
    } catch (err) {
      console.error('account load failed', err);
      renderError('We could not reach the server. Check your connection and refresh the page.');
    }
  }

  load();
})();
</script>

</body>
</html>
