<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">

<title>Your account — StudioLAB Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Local semantic-status tokens. Mirrors the admin pill palette so studio
     and admin views read identically for paid / authorised / card_saved /
     pending / info / crit / muted statuses. */
  :root {
    --st-ok-fg:    #047857;  --st-ok-bg:    #D1FAE5;
    --st-warn-fg:  #B45309;  --st-warn-bg:  #FEF3C7;
    --st-info-fg:  #1E40AF;  --st-info-bg:  #DBEAFE;
    --st-crit-fg:  #B91C1C;  --st-crit-bg:  #FEE2E2;
    --st-err-fg:   #991B1B;  --st-err-bg:   #FEF2F2;  --st-err-bd: #FCA5A5;
  }
  .acct-wrap { max-width: 880px; margin: 32px auto 80px; padding: 0 16px; }
  .acct-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .acct-hdr h1 { font-size: 26px; font-weight: 800; color: var(--in-d); margin: 0 0 4px; letter-spacing: -0.4px; }
  .acct-hdr .acct-sub { color: var(--g6); font-size: 14px; }
  .acct-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acct-pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .acct-pill-plan { background: var(--in-l); color: var(--in-d); }
  .acct-pill-status-paid { background: var(--st-ok-bg); color: var(--st-ok-fg); }
  .acct-pill-status-authorised { background: var(--st-warn-bg); color: var(--st-warn-fg); }
  .acct-pill-status-card_saved { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-pill-status-pending { background: var(--g2); color: var(--g6); }
  /* Quote-specific pill variants. Sent/Viewed = info blue. Cancelled/
     Declined = red. Expired/Revised = neutral grey. */
  .acct-pill-status-info { background: var(--st-info-bg); color: var(--st-info-fg); }
  .acct-pill-status-crit { background: var(--st-crit-bg); color: var(--st-crit-fg); }
  .acct-pill-status-muted { background: var(--g2); color: var(--g6); }

  .acct-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(19,16,46,.06); padding: 22px 24px; margin-bottom: 18px; }
  .acct-card h2 { font-size: 14px; font-weight: 700; color: var(--g6); margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.6px; }
  .acct-card .acct-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--g1); font-size: 13px; }
  .acct-card .acct-row:last-child { border-bottom: 0; }
  .acct-card .acct-k { width: 160px; flex-shrink: 0; color: var(--g6); }
  .acct-card .acct-v { color: var(--in-d); }
  .acct-card .acct-v a { color: var(--in); text-decoration: none; font-weight: 600; }

  .acct-next ol { margin: 0; padding-left: 20px; color: var(--in-d); }
  .acct-next li { margin-bottom: 8px; line-height: 1.55; }
  /* "What happens next" upgraded layout — a four-step status block that
     reads as a definition list rather than a numbered queue, so the studio
     understands what we have, what we're doing, what we need from them,
     and what happens at the end. Plan-agnostic copy lives in JS. */
  .acct-stages { display: grid; gap: 14px; }
  .acct-stage { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: flex-start; }
  .acct-stage-icon { width: 28px; height: 28px; border-radius: 999px; background: var(--in-l); color: var(--in-d); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .acct-stage-label { font-size: 13px; font-weight: 700; color: var(--in-d); margin: 4px 0 2px; }
  .acct-stage-body { font-size: 13px; line-height: 1.55; color: var(--g6); }

  /* Inline message thread + composer. Replaces the old "reply to email"
     dead-end with a directly-usable thread on the account page itself.
     Mirrors portal.html visual idiom but compacted for embed. */
  .acct-thread { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px 2px; margin-bottom: 14px; scrollbar-gutter: stable; }
  .acct-thread-empty { color: var(--g6); font-style: italic; text-align: center; padding: 28px 12px; font-size: 13px; }
  .acct-thread-loading { color: var(--g6); font-style: italic; padding: 12px 0; font-size: 13px; }
  .acct-msg-bubble { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
  .acct-msg-bubble .acct-msg-meta { font-size: 11px; color: var(--g6); margin-bottom: 4px; font-weight: 600; }
  .acct-msg-bubble .acct-msg-body { color: var(--in-d); }
  .acct-msg-bubble .acct-msg-body p { margin: 0 0 6px; }
  .acct-msg-bubble .acct-msg-body p:last-child { margin-bottom: 0; }
  .acct-msg-bubble .acct-msg-body a { color: var(--in); }
  .acct-msg-mine { align-self: flex-end; background: var(--in); color: #fff; }
  .acct-msg-mine .acct-msg-meta { color: rgba(255,255,255,0.85); }
  .acct-msg-mine .acct-msg-body { color: #fff; }
  .acct-msg-mine .acct-msg-body a { color: #fff; text-decoration: underline; }
  .acct-msg-them { align-self: flex-start; background: var(--g1); }
  .acct-msg-system { align-self: center; background: transparent; padding: 4px 12px; color: var(--g6); font-size: 12px; font-style: italic; }
  .acct-msg-system .acct-msg-body { color: var(--g6); }

  .acct-compose { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--g1); padding-top: 14px; }
  .acct-compose textarea { width: 100%; min-height: 80px; padding: 12px 14px; border: 1px solid var(--g2); border-radius: 10px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: vertical; color: var(--in-d); background: #fff; }
  .acct-compose textarea:focus { outline: 2px solid var(--in); outline-offset: 1px; border-color: var(--in); }
  .acct-compose-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .acct-compose-hint { color: var(--g6); font-size: 12px; flex: 1; min-width: 200px; }
  .acct-compose-hint a { color: var(--in); font-weight: 600; }
  .acct-compose-err { color: var(--st-err-fg); font-size: 12px; }
  .acct-compose button { min-width: 96px; }
  .acct-compose button[disabled] { opacity: 0.55; cursor: not-allowed; }
  /* Attachment chips on the inline composer. Pre-send the file picker
     stashes File objects in state; chips render here so the studio can
     remove one before hitting Send. Mirrors portal.js's pattern but
     compacted for the embedded composer. */
  .acct-compose-files { display: flex; flex-wrap: wrap; gap: 6px; }
  .acct-file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; background: var(--g1); border-radius: 999px; font-size: 12px; color: var(--in-d); }
  .acct-file-chip.oversize { background: var(--st-err-bg); color: var(--st-err-fg); }
  .acct-file-chip button { background: transparent; border: 0; color: var(--g6); font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .acct-file-chip button:hover { color: var(--st-crit-fg); }
  .acct-attach-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--g2); border-radius: 999px; font-size: 12px; color: var(--in-d); cursor: pointer; background: #fff; font-weight: 600; }
  .acct-attach-btn:hover { border-color: var(--in); color: var(--in); }
  .acct-attach-btn input { display: none; }

  /* Inline editing. Each editable card gets a pencil button in its
     header; clicking swaps the static rows for an inline form with
     Save / Cancel. Locked fields stay rendered as static rows even
     in edit mode so the studio sees what they can't touch. */
  .acct-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .acct-card-hdr h2 { margin: 0; }
  .acct-edit-btn { background: transparent; border: 0; color: var(--in); font-size: 12px; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 6px; min-height: 32px; }
  .acct-edit-btn:hover { background: var(--in-l); }
  .acct-edit-btn:focus-visible { outline: 2px solid var(--in); outline-offset: 1px; }
  .acct-edit-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px; align-items: start; }
  .acct-edit-grid label { color: var(--g6); font-size: 13px; padding: 10px 0 0; }
  .acct-edit-grid .acct-edit-locked { color: var(--in-d); font-size: 13px; padding: 10px 0 0; }
  .acct-edit-grid input[type="text"],
  .acct-edit-grid input[type="url"],
  .acct-edit-grid input[type="tel"],
  .acct-edit-grid input[type="email"],
  .acct-edit-grid select,
  .acct-edit-grid textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--g2); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--in-d); background: #fff; }
  .acct-edit-grid input:focus,
  .acct-edit-grid select:focus,
  .acct-edit-grid textarea:focus { outline: 2px solid var(--in); outline-offset: 1px; border-color: var(--in); }
  .acct-edit-grid textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .acct-edit-grid input[type="color"] { width: 50px; height: 36px; padding: 2px; border: 1px solid var(--g2); border-radius: 8px; }
  .acct-edit-actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; padding-top: 6px; }
  .acct-edit-actions .acct-edit-msg { flex: 1; font-size: 12px; color: var(--g6); }
  .acct-edit-actions .acct-edit-msg.err { color: var(--st-err-fg); }
  .acct-edit-actions .acct-edit-msg.ok { color: var(--st-ok-fg); }

  /* Tab navigation. Three panels: Home (status + messages), Billing
     (invoices + quotes), Setup (the editable cards). The previous
     single-stack layout had the editable cards below the fold so the
     studio had to scroll past status and invoices to find the actions
     -- which read as "no actions available." Tabs put each surface one
     click from the top. Tabs are hidden once status='active' since the
     onboarding portal is done at that point. */
  .acct-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--g2); margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; }
  .acct-tabs::-webkit-scrollbar { display: none; }
  .acct-tab { background: transparent; border: 0; padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--g6); cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; min-height: 44px; transition: color 0.15s, border-color 0.15s; }
  .acct-tab:hover { color: var(--in-d); }
  .acct-tab:focus-visible { outline: 2px solid var(--in); outline-offset: -2px; border-radius: 4px; }
  .acct-tab.active { color: var(--in); border-bottom-color: var(--in); }
  .acct-tab .acct-tab-badge { background: var(--mg); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; line-height: 1.4; }
  .acct-tab .acct-tab-count { background: var(--g1); color: var(--g6); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; line-height: 1.4; }
  .acct-tab.active .acct-tab-count { background: var(--in-l); color: var(--in); }
  .acct-tab-panel { display: none; }
  .acct-tab-panel.active { display: block; }

  /* Activation banner. Replaces "Where you're at" + "Messages" stack
     once the admin marks the studio active, since the onboarding portal
     has done its job. Communication and product use move to the GHL
     platform; this surface becomes a confirmation page. */
  .acct-active-banner { background: linear-gradient(135deg, #047857 0%, #065F46 100%); color: #fff; border-radius: 14px; padding: 28px 30px; margin-bottom: 18px; box-shadow: 0 6px 22px rgba(4,120,87,0.18); }
  .acct-active-banner h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; color: #fff; text-transform: none; }
  .acct-active-banner p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.92); }
  .acct-active-banner p:last-child { margin-bottom: 0; }
  .acct-active-banner .acct-active-meta { font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 12px; }

  .acct-inv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acct-inv-table th { text-align: left; font-weight: 600; color: var(--g6); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--g2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .acct-inv-table td { padding: 12px 8px 12px 0; border-bottom: 1px solid var(--g1); vertical-align: middle; }
  .acct-inv-table tr:last-child td { border-bottom: 0; }
  .acct-inv-table .acct-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  /* WCAG 2.5.5 (AAA target size). Inv/quote actions are inline text links;
     pad them up to a 44px effective target without breaking the inline
     flow of the cell. */
  .acct-inv-table .acct-actions a { color: var(--in); font-weight: 600; text-decoration: none; font-size: 12px; display: inline-flex; align-items: center; min-height: 44px; padding: 6px 0; }
  .acct-inv-table .acct-actions a:hover { text-decoration: underline; }
  .acct-inv-table .acct-actions a:focus-visible { outline: 2px solid var(--in); outline-offset: 2px; border-radius: 4px; }

  .acct-msg { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--in-l); border-radius: 10px; }
  .acct-msg-text { flex: 1; }
  .acct-msg-text strong { color: var(--in-d); }
  .acct-msg-text p { margin: 4px 0 0; color: var(--g6); font-size: 13px; line-height: 1.5; }
  .acct-msg-unread { background: var(--mg); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .acct-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--in); color: #fff; text-decoration: none; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .acct-btn:hover { background: var(--in-d); }
  .acct-btn-secondary { background: transparent; color: var(--in); border: 1px solid var(--in); }
  .acct-btn-secondary:hover { background: var(--in); color: #fff; }

  .acct-loading, .acct-empty { color: var(--g6); font-style: italic; padding: 12px 0; }
  .acct-error { background: var(--st-err-bg); border: 1px solid var(--st-err-bd); color: var(--st-err-fg); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; font-size: 13px; }
  .acct-foot { text-align: center; margin-top: 28px; color: var(--g6); font-size: 12px; line-height: 1.6; }
  .acct-foot a { color: var(--in); font-weight: 600; }
</style>

<body>

<header class="hdr">
  <div class="hdr-inner">
    <a class="hdr-logo" href="/" aria-label="StudioLAB Growth — account setup">
      <img src="assets/growth-logo-white.svg" alt="StudioLAB Growth">
    </a>
    <div class="hdr-div" aria-hidden="true"></div>
    <div class="hdr-sub" aria-hidden="true">Your account</div>
    <div style="flex:1;"></div>
    <button type="button" id="acctSignOut" style="background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Sign out</button>
  </div>
</header>

<main>
  <div class="acct-wrap" id="acctRoot">
    <div class="acct-loading">Loading your account…</div>
  </div>
</main>

<script src="js/supabase-config.js?v=20260514a"></script>
<script>
(function () {
  'use strict';
  const FN_BASE = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url) + '/functions/v1/';
  const SESSION_KEY = 'sl-growth-session';

  // Sign out — clears the studio session from localStorage and bounces to
  // a fresh /. Bound before any async loads so it works even if the
  // account fetch hangs.
  const signOutBtn = document.getElementById('acctSignOut');
  if (signOutBtn) {
    signOutBtn.addEventListener('click', function () {
      try { localStorage.removeItem(SESSION_KEY); } catch (_) { /* ignore */ }
      // Land on the OTP sign-in page rather than the public gate page.
      // From /setup/ the studio can immediately enter an email to re-auth
      // (their own or a different studio) without re-finding the welcome
      // email. href (not replace) so back-button still works.
      window.location.href = '/setup/';
    });
  }
  const PLAN_LABEL = { launch: 'Launch', scale: 'Scale', ai: 'Dominate AI' };
  const SETUP_LABEL = { dfy: 'Done-For-You', guided: 'Guided self-setup' };
  const STATUS_PILL = {
    paid: { cls: 'acct-pill-status-paid', label: 'Paid' },
    authorised: { cls: 'acct-pill-status-authorised', label: 'Card authorised' },
    card_saved: { cls: 'acct-pill-status-card_saved', label: 'Card saved' },
    pending: { cls: 'acct-pill-status-pending', label: 'Awaiting payment' },
    unpaid: { cls: 'acct-pill-status-pending', label: 'Awaiting payment' },
    refunded: { cls: 'acct-pill-status-pending', label: 'Refunded' },
  };

  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (_) { return null; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function money(cents, currency) {
    if (cents == null) return '—';
    return (cents / 100).toLocaleString('en-AU', { style: 'currency', currency: currency || 'AUD' });
  }
  function dateFmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-AU', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function dateTimeFmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-AU', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function reviewUrlFor(sub) {
    if (!sub || !sub.plan || !sub.region) return null;
    return '/' + String(sub.region).toLowerCase() + '/' + sub.plan + '/';
  }

  function renderError(message) {
    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-error">${esc(message)}</div>
      <div class="acct-foot">
        Need help? Email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a> and we'll sort it.
      </div>`;
  }

  function renderNotPaidYet(sub) {
    const reviewUrl = reviewUrlFor(sub);
    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-hdr">
        <div>
          <h1>Welcome ${sub.studio_name ? 'back, ' + esc(sub.studio_name) : 'back'}</h1>
          <div class="acct-sub">Your setup is in progress. Pick up where you left off.</div>
        </div>
        <div class="acct-pills">
          <span class="acct-pill acct-pill-plan">${esc(PLAN_LABEL[sub.plan] || sub.plan || 'Setup')}</span>
          <span class="acct-pill acct-pill-status-pending">${esc(STATUS_PILL[sub.payment_status]?.label || 'In progress')}</span>
        </div>
      </div>
      <div class="acct-card">
        <h2>Pick up your setup</h2>
        <p style="margin:0 0 14px;color:var(--g6);font-size:13px;line-height:1.55;">
          Your progress is saved. Continue from where you left off — you won't lose anything.
        </p>
        ${reviewUrl ? `<a class="acct-btn" href="${esc(reviewUrl)}">Continue setup →</a>` : ''}
      </div>
      <div class="acct-foot">
        Need help? Email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a> with your studio name.
      </div>`;
  }

  function renderAccount(data) {
    const sub = data.submission;
    const invoices = data.invoices || [];
    const conv = data.conversation || {};
    const reviewUrl = reviewUrlFor(sub);
    const statusPill = STATUS_PILL[sub.payment_status] || STATUS_PILL.pending;
    const fullName = [sub.first_name, sub.last_name].filter(Boolean).join(' ');
    const isPaid = sub.payment_status === 'paid'
      || sub.payment_status === 'authorised'
      || sub.payment_status === 'card_saved';

    if (!isPaid) {
      renderNotPaidYet(sub);
      return;
    }

    // Four-stage status block. Plan-agnostic structure (have / doing /
     // need / next), with copy tweaked for AI vs Launch+Scale because the
     // turnaround windows differ. No prediction of GHL platform steps —
     // that's out of scope here; communication moves to the platform itself
     // once admin activates the account.
    const stages = sub.plan === 'ai'
      ? [
        { label: 'What we have', body: 'Your studio details, branding, knowledge base, and payment. Everything\'s in.' },
        { label: 'What we\'re doing now', body: 'Reviewing your knowledge base and tuning your AI voice and chat agents to match your studio. This typically takes 7–10 business days.' },
        { label: 'What we\'ll need from you', body: 'Nothing right now. If we have follow-up questions on your knowledge base, we\'ll send you a message below — you\'ll also get an email.' },
        { label: 'What happens next', body: 'You\'ll receive a welcome email with your login the moment your AI is ready to go live.' },
      ]
      : [
        { label: 'What we have', body: 'Your studio details, branding, and payment. Everything we need to start.' },
        { label: 'What we\'re doing now', body: 'Reviewing your submission and setting up your account behind the scenes. This typically takes 1–2 business days.' },
        { label: 'What we\'ll need from you', body: 'Nothing right now. If anything needs clarifying, we\'ll send you a message below — you\'ll also get an email.' },
        { label: 'What happens next', body: 'You\'ll receive a welcome email with your login the moment your account is ready to go live.' },
      ];

    const invoiceRows = invoices.map((inv) => `
      <tr>
        <td>${esc(inv.number || '—')}</td>
        <td>${esc(inv.kind === 'setup_invoice' ? 'Setup' : inv.kind === 'custom_charge' ? 'Add-on' : inv.kind === 'quote_invoice' ? 'Quote' : 'Credit')}</td>
        <td><span class="acct-pill ${inv.status === 'paid' ? 'acct-pill-status-paid' : 'acct-pill-status-pending'}">${esc(inv.status === 'paid' ? 'Paid' : inv.status === 'voided' ? 'Voided' : inv.status === 'refunded' ? 'Refunded' : 'Open')}</span></td>
        <td>${esc(money(inv.total_cents, inv.currency))}</td>
        <td>${esc(dateFmt(inv.issued_at))}</td>
        <td class="acct-actions">
          ${inv.hosted_url ? `<a href="${esc(inv.hosted_url)}" target="_blank" rel="noopener">View invoice</a>` : ''}
          ${inv.pdf_url ? `<a href="${esc(inv.pdf_url)}" target="_blank" rel="noopener">PDF</a>` : ''}
        </td>
      </tr>
    `).join('');

    // Quotes are surfaced separately from invoices so the studio can see
    // pending offers and their expiry. Accepted quotes generate an invoice
    // (kind='quote_invoice') which appears in the Invoices section above.
    const quotes = data.quotes || [];
    const quotesPillClass = (s) =>
      s === 'accepted' ? 'acct-pill-status-paid'
      : s === 'cancelled' || s === 'declined' ? 'acct-pill-status-crit'
      : s === 'expired' || s === 'revised' ? 'acct-pill-status-muted'
      : 'acct-pill-status-info'; // sent / viewed / draft
    const quotesPillLabel = (s) =>
      s === 'sent' ? 'Awaiting your reply'
      : s === 'viewed' ? 'Viewed'
      : s === 'accepted' ? 'Accepted'
      : s === 'declined' ? 'Declined'
      : s === 'expired' ? 'Expired'
      : s === 'cancelled' ? 'Cancelled'
      : 'Draft';
    const quotesDaysLeft = (iso, status) => {
      if (!iso) return '';
      if (status === 'accepted' || status === 'declined' || status === 'expired' || status === 'cancelled') {
        return dateFmt(iso);
      }
      const days = Math.ceil((new Date(iso).getTime() - Date.now()) / (24 * 60 * 60 * 1000));
      if (days <= 0) return 'Expired';
      if (days === 1) return '1 day left';
      return `${days} days left`;
    };
    const quoteRows = quotes.map((q) => `
      <tr>
        <td>${esc(q.number || '—')}</td>
        <td><span class="acct-pill ${quotesPillClass(q.status)}">${esc(quotesPillLabel(q.status))}</span></td>
        <td>${esc(money(q.total_cents, q.currency))}</td>
        <td>${esc(quotesDaysLeft(q.expires_at, q.status))}</td>
        <td class="acct-actions">
          <a href="#" data-q-pdf="${esc(q.id)}">Download PDF</a>
        </td>
      </tr>
    `).join('');

    // Stash the latest server view of the submission so onSaveSection
    // can build patch payloads and rerender locked-row recap without
    // refetching. Replaced on every successful save.
    acctState.submission = sub;
    acctState.invoices = invoices;
    acctState.quotes = quotes;
    acctState.conv = conv;
    acctState.fullName = fullName;
    acctState.statusPill = statusPill;
    acctState.stages = stages;
    acctState.editing = acctState.editing || {};

    const isActive = sub.status === 'active';

    // Inline thread + composer. Hidden once status='active' since the
    // studio's primary surface is the GHL platform from that point on.
    // Attachment chips render under the textarea — selected files are
    // uploaded immediately after the message is sent, mirroring
    // portal.html's two-step pattern.
    const messagesBlock = `
      <div class="acct-thread" id="acctThread">
        <div class="acct-thread-loading">Loading your conversation…</div>
      </div>
      <form class="acct-compose" id="acctCompose" novalidate>
        <textarea id="acctMsgBody" rows="3" placeholder="Type a message to our team… (Cmd/Ctrl-Enter to send)" maxlength="10000"></textarea>
        <div class="acct-compose-files" id="acctMsgFiles"></div>
        <div class="acct-compose-bar">
          <label class="acct-attach-btn" title="Attach up to 5 files, 25 MB each.">
            📎 Attach
            <input type="file" id="acctMsgFileInput" multiple>
          </label>
          <span class="acct-compose-hint" style="flex:1;min-width:120px;">Cmd/Ctrl-Enter to send.</span>
          <span class="acct-compose-err" id="acctMsgErr" role="alert"></span>
          <button type="submit" class="acct-btn" id="acctMsgSend">Send</button>
        </div>
      </form>`;

    const activationBanner = isActive
      ? `<div class="acct-active-banner">
           <h2>You're live</h2>
           <p>Your StudioLAB Growth account is active${sub.activated_at ? ' since <strong>' + esc(dateFmt(sub.activated_at)) + '</strong>' : ''}. From here on, everything happens inside your platform — bookings, leads, automations, the lot.</p>
           <p>You'll receive a separate welcome email with your platform login if you haven't already. You can safely close this tab; this onboarding portal is no longer needed.</p>
           <p class="acct-active-meta">If you can't find the platform welcome email or have any questions during handover, email <a href="mailto:info@studiolabsoftware.com" style="color:#fff;font-weight:700;text-decoration:underline;">info@studiolabsoftware.com</a>.</p>
         </div>`
      : '';

    const whereYouAreCard = isActive ? '' : `
      <div class="acct-card">
        <h2>Where you're at</h2>
        <div class="acct-stages">
          ${stages.map((s, i) => `
            <div class="acct-stage">
              <div class="acct-stage-icon" aria-hidden="true">${i + 1}</div>
              <div>
                <div class="acct-stage-label">${esc(s.label)}</div>
                <div class="acct-stage-body">${esc(s.body)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;

    const messagesCard = isActive ? '' : `
      <div class="acct-card">
        <h2>Messages with our team</h2>
        ${messagesBlock}
      </div>`;

    // Editable sections — five logical groupings of safe fields. Each
    // card is independently editable (state.editing[sectionId]) so the
    // studio can update one block without affecting the others. Hidden
    // post-activation since GHL becomes the source of truth.
    const editCards = isActive ? '' : EDIT_SECTIONS
      .map((section) => renderEditCard(section, sub, !!acctState.editing[section.id]))
      .join('');

    // Card content broken out per-tab. Each panel sits behind a tab in
     // .acct-tabs; the active panel toggles via .active. Tabs are skipped
     // entirely when status='active' since the onboarding portal becomes
     // a one-shot confirmation page at that point.
    const invoicesCard = `
      <div class="acct-card">
        <h2>Invoices</h2>
        ${invoices.length === 0
          ? '<div class="acct-empty">No invoices yet. Your setup invoice will appear here shortly after payment.</div>'
          : `<table class="acct-inv-table">
              <thead>
                <tr><th>Number</th><th>Kind</th><th>Status</th><th>Amount</th><th>Issued</th><th>Actions</th></tr>
              </thead>
              <tbody>${invoiceRows}</tbody>
            </table>`
        }
      </div>`;
    const quotesCard = `
      <div class="acct-card">
        <h2>Quotes</h2>
        ${quotes.length === 0
          ? '<div class="acct-empty">No quotes yet. If our team sends you one, it will appear here so you can track its status.</div>'
          : `<table class="acct-inv-table">
              <thead>
                <tr><th>Number</th><th>Status</th><th>Amount</th><th>Expires</th><th>Actions</th></tr>
              </thead>
              <tbody>${quoteRows}</tbody>
            </table>
            <p style="margin:14px 0 0;color:var(--g6);font-size:12px;line-height:1.55;">
              You'll receive your quote by email from Stripe. Use the link in that email to view and accept. Accepting creates an invoice with a Pay link, which will also appear in your Invoices above.
            </p>`}
      </div>`;

    // Tab counts for the badges. Messages count = unread; billing count
    // = invoices+quotes total. Setup count omitted — five sections is
    // not a useful metric and a number next to "Setup" reads as alarms.
    const unread = (conv && conv.unread) || 0;
    const billingCount = (invoices.length || 0) + (quotes.length || 0);

    const activeTab = acctState.activeTab || 'home';
    const tabsNav = isActive ? '' : `
      <nav class="acct-tabs" role="tablist" aria-label="Account sections">
        <button type="button" class="acct-tab ${activeTab === 'home' ? 'active' : ''}" role="tab" data-tab="home" aria-selected="${activeTab === 'home'}">
          Home${unread > 0 ? `<span class="acct-tab-badge" title="${unread} unread message${unread === 1 ? '' : 's'}">${unread} new</span>` : ''}
        </button>
        <button type="button" class="acct-tab ${activeTab === 'billing' ? 'active' : ''}" role="tab" data-tab="billing" aria-selected="${activeTab === 'billing'}">
          Billing${billingCount > 0 ? `<span class="acct-tab-count">${billingCount}</span>` : ''}
        </button>
        <button type="button" class="acct-tab ${activeTab === 'setup' ? 'active' : ''}" role="tab" data-tab="setup" aria-selected="${activeTab === 'setup'}">
          Setup details
        </button>
      </nav>`;

    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-hdr">
        <div>
          <h1>${sub.studio_name ? esc(sub.studio_name) : 'Your account'}</h1>
          <div class="acct-sub">${esc(fullName || sub.contact_email || '')}</div>
        </div>
        <div class="acct-pills">
          <span class="acct-pill acct-pill-plan">${esc(PLAN_LABEL[sub.plan] || sub.plan)}</span>
          <span class="acct-pill ${statusPill.cls}">${esc(statusPill.label)}</span>
        </div>
      </div>

      ${activationBanner}
      ${tabsNav}

      ${isActive ? `
        <div>
          ${invoicesCard}
          ${quotesCard}
        </div>
      ` : `
        <section class="acct-tab-panel ${activeTab === 'home' ? 'active' : ''}" role="tabpanel" data-panel="home" aria-labelledby="home">
          ${whereYouAreCard}
          <div class="acct-card">
            <h2>Messages with our team</h2>
            ${messagesBlock}
          </div>
        </section>

        <section class="acct-tab-panel ${activeTab === 'billing' ? 'active' : ''}" role="tabpanel" data-panel="billing" aria-labelledby="billing">
          ${invoicesCard}
          ${quotesCard}
        </section>

        <section class="acct-tab-panel ${activeTab === 'setup' ? 'active' : ''}" role="tabpanel" data-panel="setup" aria-labelledby="setup">
          ${editCards}
        </section>
      `}

      <div class="acct-foot">
        ${isActive
          ? 'Questions during handover? Email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a>.'
          : 'Need to reach us? Use the Home tab above, or email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a>.'}
      </div>`;

    // Bind tab + edit + PDF handlers AFTER innerHTML is set.
    bindTabHandlers();
    bindEditHandlers();

    // Hydrate the inline message thread + composer. Skipped post-
    // activation because the messages card is hidden in that state — the
    // platform's own inbox takes over. We stash sender attribution
    // globally so onMsgSend can stamp messages without re-resolving
    // closure state.
    if (!isActive) {
      window.__acctSenderName = fullName || sub.studio_name || null;
      window.__acctSenderEmail = sub.contact_email || null;
      initMessages(conv);
    }

    // PDF download handler — POSTs the session_token in the request body
    // to keep it off the URL bar and server logs. Streams the PDF back as
    // a Blob and triggers a download with the quote number as filename.
    document.getElementById('acctRoot').addEventListener('click', async (e) => {
      const a = e.target.closest('[data-q-pdf]');
      if (!a) return;
      e.preventDefault();
      const quoteId = a.getAttribute('data-q-pdf');
      const session = readSession();
      if (!session || !session.token) {
        alert('Your session has expired. Please verify your email again.');
        return;
      }
      try {
        const resp = await fetch(FN_BASE + 'get-quote-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quote_id: quoteId, session_token: session.token }),
        });
        if (!resp.ok) {
          const j = await resp.json().catch(() => ({}));
          alert((j && j.error) || 'Could not download your quote. Please try again, or reply to your confirmation email if the issue continues.');
          return;
        }
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const tmp = document.createElement('a');
        tmp.href = objUrl;
        // Pull the quote number from the matched row for the filename.
        const numCell = a.closest('tr')?.firstElementChild?.textContent?.trim();
        tmp.download = (numCell && numCell !== '—' ? numCell : 'quote') + '.pdf';
        document.body.appendChild(tmp);
        tmp.click();
        tmp.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
      } catch (err) {
        console.error('quote pdf download failed', err);
        alert('We could not reach the server. Check your connection and try again.');
      }
    });
  }

  // ------------------------------------------------------------------
  // Self-service edit. Each card declares (locked, fields). View mode
  // renders k/v rows; edit mode swaps in a form. Save POSTs the patch
  // payload to studio-self-edit, which mirrors save-draft's auth model
  // but runs against post-submit rows (save-draft refuses after submit
  // to protect the finalize emails from being replayed). Updates re-
  // render only the affected card and rebroadcast acctState.submission
  // so subsequent renders see the new values.
  // Default landing: Home (status + messages). Persisted across edit
  // re-renders so saving a field in the Setup tab doesn't bounce the
  // studio back to Home. Tab switches do NOT re-render — they toggle
  // CSS classes so the message thread DOM survives the switch and the
  // poll timer keeps targeting the same node.
  const acctState = { submission: null, editing: {}, activeTab: 'home' };

  // Field type 'select' uses options: [[value, label], ...] inline.
  // Keep labels concise — they appear next to the input, not as form
  // help text. Anything that needs a description belongs in a separate
  // explainer surface (the message thread).
  const EDIT_SECTIONS = [
    {
      id: 'contact',
      title: 'Primary contact',
      locked: (s) => ([
        { k: 'Account email', v: (s.contact_email || '—') + ' (locked)' },
      ]),
      fields: [
        { name: 'first_name',    label: 'First name',    type: 'text' },
        { name: 'last_name',     label: 'Last name',     type: 'text' },
        { name: 'role',          label: 'Your role',     type: 'text', placeholder: 'e.g. Owner, Director' },
        { name: 'contact_phone', label: 'Contact phone', type: 'tel' },
      ],
    },
    {
      id: 'studio',
      title: 'Studio details',
      locked: (s) => ([
        { k: 'Plan',         v: (PLAN_LABEL[s.plan] || s.plan || '—') + ' · ' + (SETUP_LABEL[s.setup_type] || s.setup_type || '') + ' (locked)' },
      ]),
      fields: [
        { name: 'studio_name',        label: 'Studio name',        type: 'text' },
        { name: 'country',            label: 'Country',            type: 'text' },
        { name: 'timezone',           label: 'Timezone',           type: 'text', placeholder: 'e.g. Australia/Sydney' },
        { name: 'address',            label: 'Studio address',     type: 'text' },
        { name: 'website',            label: 'Website URL',        type: 'url',  placeholder: 'https://' },
        { name: 'support_url',        label: 'Support URL',        type: 'url',  placeholder: 'https://' },
        { name: 'studio_description', label: 'Studio description', type: 'textarea' },
      ],
    },
    {
      id: 'branding',
      title: 'Branding & outbound email',
      fields: [
        { name: 'primary_colour',   label: 'Primary colour',   type: 'color' },
        { name: 'secondary_colour', label: 'Secondary colour', type: 'color' },
        { name: 'sign_off',         label: 'Email sign-off',   type: 'text', placeholder: 'e.g. The Team at Studio X' },
        { name: 'email_tone',       label: 'Email tone',       type: 'text', placeholder: 'e.g. Warm, professional' },
        { name: 'footer_notes',     label: 'Email footer notes', type: 'textarea' },
        { name: 'from_name',        label: 'From name',        type: 'text' },
        { name: 'reply_email',      label: 'Reply-to email',   type: 'email' },
        { name: 'custom_domain',    label: 'Custom domain',    type: 'text', placeholder: 'e.g. mail.yourstudio.com' },
      ],
    },
    {
      id: 'links',
      title: 'Social & booking links',
      fields: [
        { name: 'instagram_handle',    label: 'Instagram handle',    type: 'text', placeholder: '@yourhandle' },
        { name: 'facebook_url',        label: 'Facebook URL',        type: 'url',  placeholder: 'https://' },
        { name: 'google_business_url', label: 'Google Business URL', type: 'url',  placeholder: 'https://' },
        { name: 'tiktok_handle',       label: 'TikTok handle',       type: 'text', placeholder: '@yourhandle' },
        { name: 'youtube_url',         label: 'YouTube URL',         type: 'url',  placeholder: 'https://' },
        { name: 'booking_url',         label: 'Booking URL',         type: 'url',  placeholder: 'https://' },
      ],
    },
    {
      id: 'notes',
      title: 'Notes for our team',
      fields: [
        { name: 'extra_notes', label: 'Anything else', type: 'textarea', placeholder: 'Anything you want us to know that did not fit on the form.' },
      ],
    },
  ];

  function renderEditCard(section, sub, editing) {
    const locked = typeof section.locked === 'function' ? section.locked(sub) : [];
    const lockedRows = locked.map((row) => `
      <div class="acct-row">
        <div class="acct-k">${esc(row.k)}</div>
        <div class="acct-v">${esc(row.v)}</div>
      </div>`).join('');

    if (!editing) {
      const valueRows = section.fields.map((f) => {
        const v = sub[f.name];
        const display = v == null || v === '' ? '—' : String(v);
        return `<div class="acct-row">
          <div class="acct-k">${esc(f.label)}</div>
          <div class="acct-v">${esc(display)}</div>
        </div>`;
      }).join('');
      return `
        <div class="acct-card" data-section="${section.id}">
          <div class="acct-card-hdr">
            <h2>${esc(section.title)}</h2>
            <button type="button" class="acct-edit-btn" data-edit-toggle="${section.id}">✎ Edit</button>
          </div>
          ${lockedRows}
          ${valueRows}
        </div>`;
    }

    const inputs = section.fields.map((f) => {
      const v = sub[f.name] == null ? '' : String(sub[f.name]);
      const placeholder = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
      let input;
      if (f.type === 'textarea') {
        input = `<textarea name="${esc(f.name)}" rows="3"${placeholder}>${esc(v)}</textarea>`;
      } else if (f.type === 'color') {
        // Defensive fallback: input[type=color] needs a 7-char hex.
        const hex = /^#[0-9a-fA-F]{6}$/.test(v) ? v : '#000000';
        input = `<input type="color" name="${esc(f.name)}" value="${esc(hex)}">`;
      } else {
        input = `<input type="${esc(f.type)}" name="${esc(f.name)}" value="${esc(v)}"${placeholder}>`;
      }
      return `<label>${esc(f.label)}</label>${input}`;
    }).join('');

    return `
      <div class="acct-card" data-section="${section.id}">
        <div class="acct-card-hdr">
          <h2>${esc(section.title)}</h2>
        </div>
        ${lockedRows}
        <form class="acct-edit-grid" data-edit-form="${section.id}">
          ${inputs}
          <div class="acct-edit-actions">
            <span class="acct-edit-msg" data-edit-msg></span>
            <button type="button" class="acct-btn acct-btn-secondary" data-edit-cancel="${section.id}">Cancel</button>
            <button type="submit" class="acct-btn" data-edit-save="${section.id}">Save changes</button>
          </div>
        </form>
      </div>`;
  }

  function bindTabHandlers() {
    document.querySelectorAll('.acct-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-tab');
        if (!target) return;
        acctState.activeTab = target;
        document.querySelectorAll('.acct-tab').forEach((b) => {
          const isActive = b.getAttribute('data-tab') === target;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        document.querySelectorAll('.acct-tab-panel').forEach((p) => {
          p.classList.toggle('active', p.getAttribute('data-panel') === target);
        });
        // If we're switching INTO Home, mark messages read (the user can
        // now see them). Other tabs preserve unread state.
        if (target === 'home') {
          try { markThreadRead(); } catch (_) { /* best effort */ }
        }
        // Update URL hash for deep-linking + browser back/forward.
        try {
          if (history && history.replaceState) {
            history.replaceState(null, '', '#' + target);
          }
        } catch (_) { /* best effort */ }
      });
    });
  }

  function bindEditHandlers() {
    document.querySelectorAll('[data-edit-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-toggle');
        acctState.editing[id] = true;
        renderAccount({ submission: acctState.submission, invoices: acctState.invoices, quotes: acctState.quotes, conversation: acctState.conv });
      });
    });
    document.querySelectorAll('[data-edit-cancel]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-cancel');
        acctState.editing[id] = false;
        renderAccount({ submission: acctState.submission, invoices: acctState.invoices, quotes: acctState.quotes, conversation: acctState.conv });
      });
    });
    document.querySelectorAll('[data-edit-form]').forEach((form) => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        onSaveSection(form.getAttribute('data-edit-form'), form);
      });
    });
  }

  async function onSaveSection(sectionId, form) {
    const section = EDIT_SECTIONS.find((s) => s.id === sectionId);
    if (!section) return;
    const session = readSession();
    if (!session || !session.token) {
      alert('Your session has expired. Please verify your email again.');
      return;
    }
    const fd = new FormData(form);
    const patch = {};
    section.fields.forEach((f) => {
      const v = fd.get(f.name);
      patch[f.name] = v == null ? '' : String(v).trim();
    });
    const msgEl = form.querySelector('[data-edit-msg]');
    const saveBtn = form.querySelector('[data-edit-save]');
    const cancelBtn = form.querySelector('[data-edit-cancel]');
    msgEl.className = 'acct-edit-msg';
    msgEl.textContent = 'Saving…';
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    try {
      const resp = await fetch(FN_BASE + 'studio-self-edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: session.token, payload: patch }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        msgEl.className = 'acct-edit-msg err';
        msgEl.textContent = (data && data.error) || 'Could not save. Please try again.';
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        return;
      }
      // Merge the server's authoritative values back into acctState
      // so the recap render reflects the saved state precisely.
      const merged = Object.assign({}, acctState.submission, data.submission || patch);
      acctState.submission = merged;
      acctState.editing[sectionId] = false;
      renderAccount({ submission: merged, invoices: acctState.invoices, quotes: acctState.quotes, conversation: acctState.conv });
    } catch (err) {
      console.error('section save failed', err);
      msgEl.className = 'acct-edit-msg err';
      msgEl.textContent = 'We could not reach the server. Check your connection and try again.';
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  }

  // ------------------------------------------------------------------
  // Inline messages — thread + composer hydration. Auths against
  // portal-conversation using the conversation_id + studio_token returned
  // by get-studio-account (both always exist now; the loader mints them
  // if they don't already). Polls every 15s while the tab is visible so
  // admin replies render without a manual refresh. We can't use Supabase
  // realtime here because messages has admin-only RLS and the studio has
  // no JWT — polling matches the existing portal.html pattern.
  const MAX_MSG_FILES = 5;
  const MAX_MSG_BYTES = 25 * 1024 * 1024;
  const msgState = { convId: null, token: null, sending: false, pollTimer: null, pendingFiles: [] };

  function initMessages(conv) {
    if (!conv || !conv.id || !conv.token) {
      const thread = document.getElementById('acctThread');
      if (thread) thread.innerHTML = '<div class="acct-thread-empty">We could not load your conversation. Please refresh the page.</div>';
      return;
    }
    msgState.convId = conv.id;
    msgState.token = conv.token;
    msgState.pendingFiles = [];

    const form = document.getElementById('acctCompose');
    const body = document.getElementById('acctMsgBody');
    const fileInput = document.getElementById('acctMsgFileInput');
    const filesHost = document.getElementById('acctMsgFiles');
    if (form) form.addEventListener('submit', onMsgSend);
    if (body) {
      body.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    }
    if (fileInput) {
      fileInput.addEventListener('change', () => {
        addPendingMsgFiles(fileInput.files);
        fileInput.value = '';
      });
    }
    if (filesHost) {
      filesHost.addEventListener('click', (e) => {
        const rm = e.target.closest('[data-msg-rm]');
        if (!rm) return;
        msgState.pendingFiles.splice(Number(rm.getAttribute('data-msg-rm')), 1);
        renderMsgFileChips();
      });
    }

    loadThread(true).then(() => markThreadRead());
    startMsgPolling();
  }

  function addPendingMsgFiles(fileList) {
    const errEl = document.getElementById('acctMsgErr');
    if (errEl) errEl.textContent = '';
    const cap = MAX_MSG_FILES - msgState.pendingFiles.length;
    if (cap <= 0) {
      if (errEl) errEl.textContent = `You've hit the ${MAX_MSG_FILES}-file limit.`;
      return;
    }
    let firstError = '';
    let added = 0;
    for (const f of Array.from(fileList)) {
      if (added >= cap) {
        firstError = firstError || `Only ${cap} more file${cap === 1 ? '' : 's'} fit before the ${MAX_MSG_FILES}-file limit.`;
        break;
      }
      if (f.size <= 0) { firstError = firstError || `${f.name} is empty.`; continue; }
      if (f.size > MAX_MSG_BYTES) {
        firstError = firstError || `${f.name} is over the ${MAX_MSG_BYTES / 1024 / 1024} MB limit.`;
        continue;
      }
      msgState.pendingFiles.push(f);
      added++;
    }
    if (errEl && firstError) errEl.textContent = firstError;
    renderMsgFileChips();
  }

  function renderMsgFileChips() {
    const host = document.getElementById('acctMsgFiles');
    if (!host) return;
    if (!msgState.pendingFiles.length) { host.innerHTML = ''; return; }
    host.innerHTML = msgState.pendingFiles.map((f, i) => {
      const over = f.size > MAX_MSG_BYTES;
      return `<span class="acct-file-chip${over ? ' oversize' : ''}">
        📎 ${esc(f.name)} <span style="color:var(--g6);font-size:11px;">${esc(formatBytesAcct(f.size))}</span>
        <button type="button" data-msg-rm="${i}" aria-label="Remove">×</button>
      </span>`;
    }).join('');
  }

  function formatBytesAcct(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  async function uploadMsgAttachments(messageId, files) {
    const failures = [];
    for (const file of files) {
      const fd = new FormData();
      fd.append('conversation_id', msgState.convId);
      fd.append('token', msgState.token);
      fd.append('message_id', messageId);
      fd.append('file', file);
      try {
        const resp = await fetch(FN_BASE + 'upload-submission-attachment', { method: 'POST', body: fd });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || data?.ok === false) {
          failures.push(`${file.name}${data?.error ? ` (${data.error})` : ''}`);
        }
      } catch (_) { failures.push(file.name); }
    }
    return failures.length ? failures.join(', ') : null;
  }

  async function msgApi(action, extra) {
    const resp = await fetch(FN_BASE + 'portal-conversation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action,
        conversation_id: msgState.convId,
        token: msgState.token,
        ...(extra || {}),
      }),
    });
    let data = null;
    try { data = await resp.json(); } catch (_) { /* ignore */ }
    return { ok: resp.ok && data?.ok !== false, status: resp.status, data };
  }

  async function loadThread(scroll) {
    const res = await msgApi('load');
    const host = document.getElementById('acctThread');
    if (!host) return;
    if (!res.ok) {
      host.innerHTML = '<div class="acct-thread-empty">We could not load your conversation. Please refresh.</div>';
      return;
    }
    const messages = res.data?.messages || [];
    if (!messages.length) {
      host.innerHTML = '<div class="acct-thread-empty">No messages yet — say hello below and we will get back to you shortly.</div>';
      return;
    }
    host.innerHTML = messages.map(renderThreadMsg).join('');
    if (scroll) host.scrollTop = host.scrollHeight;
  }

  function renderThreadMsg(m) {
    const isStudio = m.sender_role === 'studio';
    const isSystem = m.sender_role === 'system';
    const cls = isSystem
      ? 'acct-msg-bubble acct-msg-system'
      : (isStudio ? 'acct-msg-bubble acct-msg-mine' : 'acct-msg-bubble acct-msg-them');
    const who = isSystem ? '' : (isStudio ? (m.sender_name || 'You') : (m.sender_name || 'StudioLAB Growth'));
    const ts = new Date(m.created_at).toLocaleString('en-AU', {
      dateStyle: 'medium', timeStyle: 'short', timeZone: 'Australia/Sydney',
    });
    const bodyHtml = m.body_html || textToHtml(m.body_text || '');
    if (isSystem) {
      return `<div class="${cls}"><div class="acct-msg-body">${bodyHtml} · ${esc(ts)}</div></div>`;
    }
    return `
      <div class="${cls}">
        <div class="acct-msg-meta">${esc(who)} · ${esc(ts)}</div>
        <div class="acct-msg-body">${bodyHtml}</div>
      </div>`;
  }

  // Plain-text → minimal HTML for client-side rendering of any message
  // that didn't ship body_html (system events, legacy rows). Server-side
  // textToHtml in portal-conversation does the heavier lifting for new
  // studio sends; this is just a render fallback.
  function textToHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  async function onMsgSend(e) {
    e.preventDefault();
    if (msgState.sending) return;
    const errEl = document.getElementById('acctMsgErr');
    const sendBtn = document.getElementById('acctMsgSend');
    const bodyEl = document.getElementById('acctMsgBody');
    errEl.textContent = '';
    const text = (bodyEl.value || '').trim();
    // Empty body is allowed if there are attachments — let people send
    // a file with no message body.
    if (!text && !msgState.pendingFiles.length) {
      errEl.textContent = 'Type a message or attach a file.';
      return;
    }
    if (text.length > 10000) { errEl.textContent = 'Message is too long (max 10,000 characters).'; return; }

    msgState.sending = true;
    sendBtn.disabled = true;
    const senderName = window.__acctSenderName || null;
    const senderEmail = window.__acctSenderEmail || null;
    const res = await msgApi('send', { body_text: text || '(attachment)', sender_name: senderName, sender_email: senderEmail });
    if (!res.ok) {
      msgState.sending = false;
      sendBtn.disabled = false;
      errEl.textContent = (res.data && res.data.error) || 'Could not send. Please try again.';
      return;
    }
    const messageId = res.data?.message_id;
    let attErr = null;
    if (msgState.pendingFiles.length && messageId) {
      attErr = await uploadMsgAttachments(messageId, msgState.pendingFiles);
    }
    msgState.sending = false;
    sendBtn.disabled = false;
    bodyEl.value = '';
    msgState.pendingFiles = [];
    renderMsgFileChips();
    if (attErr) errEl.textContent = 'Message sent, but some attachments failed: ' + attErr;
    await loadThread(true);
  }

  async function markThreadRead() {
    try { await msgApi('mark-read'); } catch (_) { /* best effort */ }
  }

  function startMsgPolling() {
    if (msgState.pollTimer) return;
    msgState.pollTimer = setInterval(() => {
      if (document.hidden) return;
      // Preserve scroll position unless the user is already at the bottom.
      const host = document.getElementById('acctThread');
      if (!host) return;
      const wasAtBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 40;
      loadThread(wasAtBottom);
    }, 15000);
  }

  async function load() {
    // Honour location.hash for deep-linking — receipt email's
    // "View your account" link can point at /account.html#billing to
    // land on Invoices, etc. Only accept values we recognise.
    const hash = (window.location.hash || '').replace('#', '');
    if (hash === 'home' || hash === 'billing' || hash === 'setup') {
      acctState.activeTab = hash;
    }

    const session = readSession();
    if (!session || !session.token) {
      renderError('You will need to verify your email again to see your account. Open your most recent email from us and click the setup link.');
      return;
    }

    try {
      const resp = await fetch(FN_BASE + 'get-studio-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: session.token }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        renderError((data && data.error) || 'Could not load your account. Please try again in a moment.');
        return;
      }
      renderAccount(data);
    } catch (err) {
      console.error('account load failed', err);
      renderError('We could not reach the server. Check your connection and refresh the page.');
    }
  }

  load();
})();
</script>

</body>
</html>
