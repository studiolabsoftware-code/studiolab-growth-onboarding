           <p>You'll receive a separate welcome email with your platform login if you haven't already. You can safely close this tab; this onboarding portal is no longer needed.</p>
           <p class="acct-active-meta">If you can't find the platform welcome email or have any questions during handover, email <a href="mailto:info@studiolabsoftware.com" style="color:#fff;font-weight:700;text-decoration:underline;">info@studiolabsoftware.com</a>.</p>
         </div>`
      : '';

    // DFY vs Guided framing banner. Sits above the tabs so the studio
    // always knows which mode they're in. Hidden post-activation (handled
    // by the isActive branch which doesn't render this).
    const setupTypeBanner = (isActive || !sub.setup_type) ? '' : (sub.setup_type === 'dfy'
      ? `<div class="acct-setup-banner acct-setup-banner-dfy" role="status">
           <div class="acct-setup-banner-icon" aria-hidden="true">✓</div>
           <div class="acct-setup-banner-body">
             <strong>You chose Done-For-You.</strong>
             We'll handle the setup. Work through the tiles below at your pace, each one is a different account you invite us into. Nothing is urgent and nothing blocks anything else.
           </div>
         </div>`
      : `<div class="acct-setup-banner acct-setup-banner-guided" role="status">
           <div class="acct-setup-banner-icon" aria-hidden="true">★</div>
           <div class="acct-setup-banner-body">
             <strong>You chose Guided self-setup.</strong>
             You're doing the setup yourself, the tiles below walk you through what to do for each account, and we're here in the messages thread if you get stuck.
           </div>
         </div>`);

    const setupChecklistCard = isActive ? '' : renderSetupChecklistCard(sub, acctState.setupTasks);

    const whereYouAreCard = isActive ? '' : `
      <div class="acct-card">
        <h2>Where you're at</h2>
        <div class="acct-stages">
          ${stages.map((s, i) => `
            <div class="acct-stage">
              <div class="acct-stage-icon" aria-hidden="true">${i + 1}</div>
              <div>
                <div class="acct-stage-label">${esc(s.label)}</div>
                <div class="acct-stage-body">${esc(s.body)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;

    const messagesCard = isActive ? '' : `
      <div class="acct-card">
        <h2>Messages with our team</h2>
        ${messagesBlock}
      </div>`;

    // Editable sections — five logical groupings of safe fields. Each
    // card is independently editable (state.editing[sectionId]) so the
    // studio can update one block without affecting the others. Hidden
    // post-activation since GHL becomes the source of truth.
    const editCards = isActive ? '' : EDIT_SECTIONS
      .map((section) => renderEditCard(section, sub, !!acctState.editing[section.id]))
      .join('') + renderNotificationsCard(sub);

    // Card content broken out per-tab. Each panel sits behind a tab in
     // .acct-tabs; the active panel toggles via .active. Tabs are skipped
     // entirely when status='active' since the onboarding portal becomes
     // a one-shot confirmation page at that point.
    const invoicesCard = `
      <div class="acct-card">
        <h2>Invoices</h2>
        ${invoices.length === 0
          ? '<div class="acct-empty">No invoices yet. Your setup invoice will appear here shortly after payment.</div>'
          : `<table class="acct-inv-table">
              <thead>
                <tr><th>Number</th><th>Kind</th><th>Status</th><th>Amount</th><th>Issued</th><th>Actions</th></tr>
              </thead>
              <tbody>${invoiceRows}</tbody>
            </table>`
        }
      </div>`;
    const quotesCard = `
      <div class="acct-card">
        <h2>Quotes</h2>
        ${quotes.length === 0
          ? '<div class="acct-empty">No quotes yet. If our team sends you one, it will appear here so you can track its status.</div>'
          : `<table class="acct-inv-table">
              <thead>
                <tr><th>Number</th><th>Status</th><th>Amount</th><th>Expires</th><th>Actions</th></tr>
              </thead>
              <tbody>${quoteRows}</tbody>
            </table>
            <p style="margin:14px 0 0;color:var(--g6);font-size:12px;line-height:1.55;">
              You'll receive your quote by email from Stripe. Use the link in that email to view and accept. Accepting creates an invoice with a Pay link, which will also appear in your Invoices above.
            </p>`}
      </div>`;

    // Tab counts for the badges. Messages count = unread; billing count
    // = invoices+quotes total. Setup count omitted — five sections is
    // not a useful metric and a number next to "Setup" reads as alarms.
    const unread = (conv && conv.unread) || 0;
    const billingCount = (invoices.length || 0) + (quotes.length || 0);

    const activeTab = acctState.activeTab || 'home';
    const tabsNav = isActive ? '' : `
      <nav class="acct-tabs" role="tablist" aria-label="Account sections">
        <button type="button" class="acct-tab ${activeTab === 'home' ? 'active' : ''}" role="tab" data-tab="home" aria-selected="${activeTab === 'home'}">
          Home${unread > 0 ? `<span class="acct-tab-badge" title="${unread} unread message${unread === 1 ? '' : 's'}">${unread} new</span>` : ''}
        </button>
        <button type="button" class="acct-tab ${activeTab === 'billing' ? 'active' : ''}" role="tab" data-tab="billing" aria-selected="${activeTab === 'billing'}">
          Billing${billingCount > 0 ? `<span class="acct-tab-count">${billingCount}</span>` : ''}
        </button>
        <button type="button" class="acct-tab ${activeTab === 'setup' ? 'active' : ''}" role="tab" data-tab="setup" aria-selected="${activeTab === 'setup'}">
          Setup details
        </button>
      </nav>`;

    document.getElementById('acctRoot').innerHTML = `
      <div class="acct-hdr">
        <div>
          <h1>${sub.studio_name ? esc(sub.studio_name) : 'Your account'}</h1>
          <div class="acct-sub">${esc(fullName || sub.contact_email || '')}</div>
        </div>
        <div class="acct-pills">
          <span class="acct-pill acct-pill-plan">${esc(PLAN_LABEL[sub.plan] || sub.plan)}</span>
          <span class="acct-pill ${statusPill.cls}">${esc(statusPill.label)}</span>
        </div>
      </div>

      ${activationBanner}
      ${setupTypeBanner}
      ${tabsNav}

      ${isActive ? `
        <div>
          ${invoicesCard}
          ${quotesCard}
        </div>
      ` : `
        <section class="acct-tab-panel ${activeTab === 'home' ? 'active' : ''}" role="tabpanel" data-panel="home" aria-labelledby="home">
          ${setupChecklistCard}
          ${whereYouAreCard}
          ${renderRequestsCard(sub, acctState.requests)}
          <div class="acct-card">
            <h2>Messages with our team</h2>
            ${messagesBlock}
          </div>
        </section>

        <section class="acct-tab-panel ${activeTab === 'billing' ? 'active' : ''}" role="tabpanel" data-panel="billing" aria-labelledby="billing">
          ${invoicesCard}
          ${quotesCard}
        </section>

        <section class="acct-tab-panel ${activeTab === 'setup' ? 'active' : ''}" role="tabpanel" data-panel="setup" aria-labelledby="setup">
          ${editCards}
        </section>
      `}

      <div class="acct-foot">
        ${isActive
          ? 'Questions during handover? Email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a>.'
          : 'Need to reach us? Use the Home tab above, or email <a href="mailto:info@studiolabsoftware.com">info@studiolabsoftware.com</a>.'}
      </div>`;

    // Bind tab + edit + request + PDF handlers AFTER innerHTML is set.
    bindTabHandlers();
    bindEditHandlers();
    bindRequestHandlers();
    bindSetupTileHandlers();

    // Hydrate the inline message thread + composer. Skipped post-
    // activation because the messages card is hidden in that state — the
    // platform's own inbox takes over. We stash sender attribution
    // globally so onMsgSend can stamp messages without re-resolving
    // closure state.
    if (!isActive) {
      window.__acctSenderName = fullName || sub.studio_name || null;
      window.__acctSenderEmail = sub.contact_email || null;
      initMessages(conv);
    }

    // PDF download handler — POSTs the session_token in the request body
    // to keep it off the URL bar and server logs. Streams the PDF back as
    // a Blob and triggers a download with the quote number as filename.
    document.getElementById('acctRoot').addEventListener('click', async (e) => {
      const a = e.target.closest('[data-q-pdf]');
      if (!a) return;
      e.preventDefault();
      const quoteId = a.getAttribute('data-q-pdf');
      const session = readSession();
      if (!session || !session.token) {
        alert('Your session has expired. Please verify your email again.');
        return;
      }
      try {
        const resp = await fetch(FN_BASE + 'get-quote-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quote_id: quoteId, session_token: session.token }),
        });
        if (!resp.ok) {
          const j = await resp.json().catch(() => ({}));
          alert((j && j.error) || 'Could not download your quote. Please try again, or reply to your confirmation email if the issue continues.');
          return;
        }
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const tmp = document.createElement('a');
        tmp.href = objUrl;
        // Pull the quote number from the matched row for the filename.
        const numCell = a.closest('tr')?.firstElementChild?.textContent?.trim();
        tmp.download = (numCell && numCell !== '—' ? numCell : 'quote') + '.pdf';
        document.body.appendChild(tmp);
        tmp.click();
        tmp.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
      } catch (err) {
        console.error('quote pdf download failed', err);
        alert('We could not reach the server. Check your connection and try again.');
      }
    });
  }

  // ------------------------------------------------------------------
  // Self-service edit. Each card declares (locked, fields). View mode
  // renders k/v rows; edit mode swaps in a form. Save POSTs the patch
  // payload to studio-self-edit, which mirrors save-draft's auth model
  // but runs against post-submit rows (save-draft refuses after submit
  // to protect the finalize emails from being replayed). Updates re-
  // render only the affected card and rebroadcast acctState.submission
  // so subsequent renders see the new values.
  // Default landing: Home (status + messages). Persisted across edit
  // re-renders so saving a field in the Setup tab doesn't bounce the
  // studio back to Home. Tab switches do NOT re-render — they toggle
  // CSS classes so the message thread DOM survives the switch and the
  // poll timer keeps targeting the same node.
  const acctState = { submission: null, editing: {}, activeTab: 'home' };

  // Field type 'select' uses options: [[value, label], ...] inline.
  // Keep labels concise — they appear next to the input, not as form
  // help text. Anything that needs a description belongs in a separate
  // explainer surface (the message thread).
  const EDIT_SECTIONS = [
    {
      id: 'contact',
      title: 'Primary contact',
      locked: (s) => ([
        { k: 'Account email', v: (s.contact_email || '—') + ' (locked)' },
      ]),
      fields: [
        { name: 'first_name',    label: 'First name',    type: 'text' },
        { name: 'last_name',     label: 'Last name',     type: 'text' },
        { name: 'role',          label: 'Your role',     type: 'text', placeholder: 'e.g. Owner, Director' },
        { name: 'contact_phone', label: 'Contact phone', type: 'tel' },
      ],
    },
    {
      id: 'studio',
      title: 'Studio details',
      locked: (s) => ([
        { k: 'Plan',         v: (PLAN_LABEL[s.plan] || s.plan || '—') + ' · ' + (SETUP_LABEL[s.setup_type] || s.setup_type || '') + ' (locked)' },
      ]),
      fields: [
        { name: 'studio_name',        label: 'Studio name',        type: 'text' },
        { name: 'country',            label: 'Country',            type: 'text' },
        { name: 'timezone',           label: 'Timezone',           type: 'text', placeholder: 'e.g. Australia/Sydney' },
        { name: 'address',            label: 'Studio address',     type: 'text' },
        { name: 'website',            label: 'Website URL',        type: 'url',  placeholder: 'https://' },
        { name: 'support_url',        label: 'Support URL',        type: 'url',  placeholder: 'https://' },
        { name: 'studio_description', label: 'Studio description', type: 'textarea' },
      ],
    },
    {
      id: 'branding',
      title: 'Branding & outbound email',
      fields: [
        { name: 'primary_colour',   label: 'Primary colour',   type: 'color' },
        { name: 'secondary_colour', label: 'Secondary colour', type: 'color' },
        { name: 'sign_off',         label: 'Email sign-off',   type: 'text', placeholder: 'e.g. The Team at Studio X' },
        { name: 'email_tone',       label: 'Email tone',       type: 'text', placeholder: 'e.g. Warm, professional' },
        { name: 'footer_notes',     label: 'Email footer notes', type: 'textarea' },
        { name: 'from_name',        label: 'From name',        type: 'text' },
        { name: 'reply_email',      label: 'Reply-to email',   type: 'email' },
        { name: 'custom_domain',    label: 'Custom domain',    type: 'text', placeholder: 'e.g. mail.yourstudio.com' },
      ],
    },
    {
      id: 'links',
      title: 'Social & booking links',
      fields: [
        { name: 'instagram_handle',    label: 'Instagram handle',    type: 'text', placeholder: '@yourhandle' },
        { name: 'facebook_url',        label: 'Facebook URL',        type: 'url',  placeholder: 'https://' },
        { name: 'google_business_url', label: 'Google Business URL', type: 'url',  placeholder: 'https://' },
        { name: 'tiktok_handle',       label: 'TikTok handle',       type: 'text', placeholder: '@yourhandle' },
        { name: 'youtube_url',         label: 'YouTube URL',         type: 'url',  placeholder: 'https://' },
        { name: 'booking_url',         label: 'Booking URL',         type: 'url',  placeholder: 'https://' },
      ],
    },
    {
      id: 'notes',
      title: 'Notes for our team',
      fields: [
        { name: 'extra_notes', label: 'Anything else', type: 'textarea', placeholder: 'Anything you want us to know that did not fit on the form.' },
      ],
    },
  ];

  function renderEditCard(section, sub, editing) {
    const locked = typeof section.locked === 'function' ? section.locked(sub) : [];
    const lockedRows = locked.map((row) => `
      <div class="acct-row">
        <div class="acct-k">${esc(row.k)}</div>
        <div class="acct-v">${esc(row.v)}</div>
      </div>`).join('');

    if (!editing) {
      const valueRows = section.fields.map((f) => {
        const v = sub[f.name];
        const display = v == null || v === '' ? '—' : String(v);
        return `<div class="acct-row">
          <div class="acct-k">${esc(f.label)}</div>
          <div class="acct-v">${esc(display)}</div>
        </div>`;
      }).join('');
      return `
        <div class="acct-card" data-section="${section.id}">
          <div class="acct-card-hdr">
            <h2>${esc(section.title)}</h2>
            <button type="button" class="acct-edit-btn" data-edit-toggle="${section.id}">✎ Edit</button>
          </div>
          ${lockedRows}
          ${valueRows}
        </div>`;
    }

    const inputs = section.fields.map((f) => {
      const v = sub[f.name] == null ? '' : String(sub[f.name]);
      const placeholder = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
      let input;
      if (f.type === 'textarea') {
        input = `<textarea name="${esc(f.name)}" rows="3"${placeholder}>${esc(v)}</textarea>`;
      } else if (f.type === 'color') {
        // Defensive fallback: input[type=color] needs a 7-char hex.
        const hex = /^#[0-9a-fA-F]{6}$/.test(v) ? v : '#000000';
        input = `<input type="color" name="${esc(f.name)}" value="${esc(hex)}">`;
      } else {
        input = `<input type="${esc(f.type)}" name="${esc(f.name)}" value="${esc(v)}"${placeholder}>`;
      }
      return `<label>${esc(f.label)}</label>${input}`;
    }).join('');

    return `
      <div class="acct-card" data-section="${section.id}">
        <div class="acct-card-hdr">
          <h2>${esc(section.title)}</h2>
        </div>
        ${lockedRows}
        <form class="acct-edit-grid" data-edit-form="${section.id}">
          ${inputs}
          <div class="acct-edit-actions">
            <span class="acct-edit-msg" data-edit-msg></span>
            <button type="button" class="acct-btn acct-btn-secondary" data-edit-cancel="${section.id}">Cancel</button>
            <button type="submit" class="acct-btn" data-edit-save="${section.id}">Save changes</button>
          </div>
        </form>
      </div>`;
  }

  // ------------------------------------------------------------------
  // Service requests — Home-tab card + new-request modal. Pricing
  // never appears on the studio surface; admin issues quotes manually
  // and the quote flows through the existing Billing tab.
  const REQ_KIND_LABEL = {
    plan_upgrade: 'Plan upgrade',
    setup_change: 'Setup type change',
    custom_addon: 'Custom add-on',
    other: 'General request',
  };
  const REQ_STATUS_LABEL = {
    open:      { cls: 'acct-req-pill-open',      label: 'Submitted' },
    quoted:    { cls: 'acct-req-pill-quoted',    label: 'Quote sent' },
    paid:      { cls: 'acct-req-pill-paid',      label: 'Quote paid, applying' },
    applied:   { cls: 'acct-req-pill-applied',   label: 'Done' },
    declined:  { cls: 'acct-req-pill-declined',  label: 'Declined' },
    withdrawn: { cls: 'acct-req-pill-withdrawn', label: 'Withdrawn' },
  };

  function describeRequest(r, sub) {
    if (r.kind === 'plan_upgrade') {
      const fromLabel = PLAN_LABEL[sub.plan] || sub.plan || '—';
      const toLabel = PLAN_LABEL[r.target_plan] || r.target_plan || '—';
      return `Upgrade plan: ${fromLabel} → ${toLabel}`;
    }
    if (r.kind === 'setup_change') {
      const fromLabel = SETUP_LABEL[sub.setup_type] || sub.setup_type || '—';
      const toLabel = SETUP_LABEL[r.target_setup_type] || r.target_setup_type || '—';
      return `Setup change: ${fromLabel} → ${toLabel}`;
    }
    if (r.kind === 'custom_addon') return 'Custom add-on';
    return 'General request';
  }

  function renderRequestsCard(sub, requests) {
    const rows = (requests || []).map((r) => {
      const st = REQ_STATUS_LABEL[r.status] || REQ_STATUS_LABEL.open;
      const created = dateFmt(r.created_at);
      const headline = describeRequest(r, sub);
      const billingLink = (r.status === 'quoted' || r.status === 'paid')
        ? ' · <a href="#billing" data-tab-link="billing">View on Billing tab →</a>'
        : '';
      const appliedLine = r.status === 'applied' && r.applied_at
        ? ' · Applied ' + esc(dateFmt(r.applied_at))
        : '';
      const declineLine = r.status === 'declined' && r.declined_reason
        ? `<div class="acct-req-row-decline"><strong>Reason:</strong> ${esc(r.declined_reason)}</div>`
        : '';
      return `
        <div class="acct-req-row">
          <div>
            <div class="acct-req-row-title">${esc(headline)}</div>
            <div class="acct-req-row-meta">Submitted ${esc(created)}${appliedLine}${billingLink}</div>
          </div>
          <span class="acct-pill ${st.cls}">${esc(st.label)}</span>
          ${r.notes ? `<div class="acct-req-row-notes">${esc(r.notes)}</div>` : ''}
          ${declineLine}
        </div>`;
    }).join('');

    return `
      <div class="acct-card">
        <div class="acct-req-hdr">
          <div>
            <h2>Request a change</h2>
            <p class="acct-req-hdr-sub">Want to upgrade, switch setup type, or have us build something extra? Raise a request and our team will come back to you with a quote.</p>
          </div>
          <button type="button" class="acct-btn" data-req-new>Request a change</button>
        </div>
        ${rows
          ? `<div class="acct-req-list">${rows}</div>`
          : `<div class="acct-req-empty">No requests yet. When you ask for something, it shows up here so you can track its status.</div>`}
      </div>`;
  }

  function bindRequestHandlers() {
    const newBtn = document.querySelector('[data-req-new]');
    if (newBtn) newBtn.addEventListener('click', openRequestModal);
    // Deep-link to Billing tab from the request rows.
    document.querySelectorAll('[data-tab-link]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const target = a.getAttribute('data-tab-link');
        const tabBtn = document.querySelector('.acct-tab[data-tab="' + target + '"]');
        if (tabBtn) tabBtn.click();
      });
    });
  }

  function openRequestModal() {
    const sub = acctState.submission;
    if (!sub) return;
    const currentPlan = sub.plan;
    const currentSetup = sub.setup_type;

    // Available upgrade options — strictly upward from current plan.
    const planOptions = [
      { v: 'scale', label: 'Scale', enabled: currentPlan === 'launch' },
      { v: 'ai',    label: 'Dominate AI', enabled: currentPlan === 'launch' || currentPlan === 'scale' },
    ].filter((o) => o.enabled);

    const setupTarget = currentSetup === 'guided' ? 'dfy' : 'guided';
    const setupTargetLabel = SETUP_LABEL[setupTarget];

    const backdrop = document.createElement('div');
    backdrop.className = 'acct-modal-backdrop';
    backdrop.innerHTML = `
      <div class="acct-modal-card" role="dialog" aria-modal="true" aria-labelledby="acctReqTitle">
        <div class="acct-modal-hdr">
          <h3 id="acctReqTitle">Request a change</h3>
          <button type="button" class="acct-modal-close" data-req-close aria-label="Close">×</button>
        </div>
        <p class="acct-modal-sub">Tell us what you need. We'll review and come back to you with a quote, usually within 1 to 2 business days. No charge until you accept the quote.</p>
        <form class="acct-modal-form" id="acctReqForm" novalidate>
          <label for="acctReqKind">What kind of request?</label>
          <select id="acctReqKind" name="kind">
            ${planOptions.length ? '<option value="plan_upgrade">Upgrade my plan</option>' : ''}
            <option value="setup_change">Switch setup type (${esc(SETUP_LABEL[currentSetup] || currentSetup)} → ${esc(setupTargetLabel)})</option>
            <option value="custom_addon">Custom add-on (website, integration, etc.)</option>
            <option value="other">Something else</option>
          </select>

          <div data-req-target="plan_upgrade" style="display:none;">
            <label for="acctReqPlan">Upgrade to</label>
            <select id="acctReqPlan" name="target_plan">
              ${planOptions.map((o) => `<option value="${esc(o.v)}">${esc(o.label)}</option>`).join('')}
            </select>
            <p class="acct-modal-current">You're currently on <strong>${esc(PLAN_LABEL[currentPlan] || currentPlan)}</strong>.</p>
          </div>

          <input type="hidden" name="target_setup_type" value="${esc(setupTarget)}">

          <label for="acctReqNotes">Tell us more</label>
          <textarea id="acctReqNotes" name="notes" maxlength="2000" placeholder="What would you like us to do? Any timing, budget, or specifics we should know about?"></textarea>

          <div class="acct-modal-actions">
            <span class="acct-modal-err" data-req-err></span>
            <button type="button" class="acct-btn acct-btn-secondary" data-req-close>Cancel</button>
            <button type="submit" class="acct-btn" data-req-submit>Send request</button>
          </div>
        </form>
      </div>`;
    document.body.appendChild(backdrop);

    // Kind switch shows/hides the plan picker.
    const kindEl = backdrop.querySelector('#acctReqKind');
    const planBlock = backdrop.querySelector('[data-req-target="plan_upgrade"]');
    function syncKind() {
      const k = kindEl.value;
      planBlock.style.display = k === 'plan_upgrade' ? '' : 'none';
    }
    kindEl.addEventListener('change', syncKind);
    syncKind();

    function closeModal() {
      backdrop.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) {
      if (e.key === 'Escape') closeModal();
    }
    document.addEventListener('keydown', onKey);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });
    backdrop.querySelectorAll('[data-req-close]').forEach((b) => b.addEventListener('click', closeModal));

    backdrop.querySelector('#acctReqForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = backdrop.querySelector('[data-req-err]');
      const submitBtn = backdrop.querySelector('[data-req-submit]');
      const cancelBtn = backdrop.querySelector('.acct-btn-secondary');
      errEl.textContent = '';
      const fd = new FormData(e.target);
      const kind = String(fd.get('kind') || '');
      const notes = String(fd.get('notes') || '').trim();
      if (!notes) { errEl.textContent = 'Tell us a bit about what you need.'; return; }

      const payload = { kind, notes };
      if (kind === 'plan_upgrade') payload.target_plan = String(fd.get('target_plan') || '');
      if (kind === 'setup_change') payload.target_setup_type = String(fd.get('target_setup_type') || '');

      submitBtn.disabled = true;
      cancelBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      try {
        const session = readSession();
        const resp = await fetch(FN_BASE + 'studio-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_token: session.token, ...payload }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) {
          submitBtn.disabled = false;
          cancelBtn.disabled = false;
          submitBtn.textContent = 'Send request';
          errEl.textContent = (data && data.error) || 'Could not send. Please try again.';
          return;
        }
        // Prepend the new request to state and re-render so the studio
        // sees the row immediately and the modal closes.
        acctState.requests = [data.request].concat(acctState.requests || []);
        closeModal();
        renderAccount({
          submission: acctState.submission,
          invoices: acctState.invoices,
          quotes: acctState.quotes,
          conversation: acctState.conv,
          service_requests: acctState.requests,
        });
        // Also nudge the thread so the system message lands instantly
        // rather than waiting for the 15s poll tick.
        try { loadThread(true); } catch (_) { /* best effort */ }
      } catch (err) {
        console.error('request submit failed', err);
        submitBtn.disabled = false;
        cancelBtn.disabled = false;
        submitBtn.textContent = 'Send request';
        errEl.textContent = 'We could not reach the server. Check your connection and try again.';
      }
    });

    // Focus the first input for keyboard users.
    setTimeout(() => { const el = backdrop.querySelector('#acctReqKind'); if (el) el.focus(); }, 50);
  }

  function bindTabHandlers() {
    document.querySelectorAll('.acct-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-tab');
        if (!target) return;
        acctState.activeTab = target;
        document.querySelectorAll('.acct-tab').forEach((b) => {
          const isActive = b.getAttribute('data-tab') === target;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        document.querySelectorAll('.acct-tab-panel').forEach((p) => {
          p.classList.toggle('active', p.getAttribute('data-panel') === target);
        });
        // If we're switching INTO Home, mark messages read (the user can
        // now see them). Other tabs preserve unread state.
        if (target === 'home') {
          try { markThreadRead(); } catch (_) { /* best effort */ }
        }
        // Update URL hash for deep-linking + browser back/forward.
        try {
          if (history && history.replaceState) {
            history.replaceState(null, '', '#' + target);
          }
        } catch (_) { /* best effort */ }
      });
    });
  }

  // Notifications card — sits at the bottom of the Setup tab. Single
  // toggle for the studio email opt-out (migration 039). Hits the
  // unsubscribe edge function with the studio's stable token rather
  // than studio-self-edit, so it doesn't fire the admin diff email on
  // every flip.
  function renderNotificationsCard(sub) {
    const on = sub.email_notifications_enabled !== false;
    return `
      <div class="acct-card" data-section="notifications">
        <div class="acct-card-hdr">
          <h2>Email notifications</h2>
          <button type="button" class="acct-edit-btn" data-notif-toggle="${on ? 'off' : 'on'}">
            ${on ? 'Turn off optional emails' : 'Turn on optional emails'}
          </button>
        </div>
        <div class="acct-row" style="border-bottom:0;">
          <div class="acct-k">Status</div>
          <div class="acct-v">
            <span class="acct-pill ${on ? 'acct-pill-status-paid' : 'acct-pill-status-muted'}">${on ? 'Receiving optional emails' : 'Opted out of optional emails'}</span>
          </div>
        </div>
        <p style="margin:12px 0 0;color:var(--g6);font-size:12px;line-height:1.55;">
          ${on
            ? 'You currently receive inbox notifications, quote reminders, and other optional updates by email. You\'ll always receive essential transactional emails, payment receipts, security codes, and confirmations of changes you request, regardless of this setting.'
            : 'You\'re opted out of inbox notifications, quote reminders, and other optional updates. You\'ll still receive essential transactional emails, payment receipts, security codes, and confirmations of changes you request.'}
        </p>
      </div>`;
  }

  async function toggleStudioNotifications(nextEnabled) {
    const sub = acctState.submission;
    if (!sub || !sub.unsubscribe_token) {
      alert('Could not update. Please refresh and try again.');
      return;
    }
    try {
      const resp = await fetch(FN_BASE + 'unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'set', token: sub.unsubscribe_token, enabled: nextEnabled }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        alert((data && data.error) || 'Could not update notifications. Please try again.');
        return;
      }
      // Patch local state and re-render so the card reflects the new
      // setting without a full reload.
      acctState.submission = { ...sub, email_notifications_enabled: nextEnabled };
      renderAccount({
        submission: acctState.submission,
        invoices: acctState.invoices,
        quotes: acctState.quotes,
        conversation: acctState.conv,
        service_requests: acctState.requests,
      });
    } catch (err) {
      console.error('notification toggle failed', err);
      alert('We could not reach the server. Check your connection and try again.');
    }
  }

  function bindEditHandlers() {
    document.querySelectorAll('[data-edit-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-toggle');
        acctState.editing[id] = true;
        renderAccount({ submission: acctState.submission, invoices: acctState.invoices, quotes: acctState.quotes, conversation: acctState.conv });
      });
    });
    document.querySelectorAll('[data-edit-cancel]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-cancel');
        acctState.editing[id] = false;
        renderAccount({ submission: acctState.submission, invoices: acctState.invoices, quotes: acctState.quotes, conversation: acctState.conv });
      });
    });
    document.querySelectorAll('[data-edit-form]').forEach((form) => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        onSaveSection(form.getAttribute('data-edit-form'), form);
      });
    });
    document.querySelectorAll('[data-notif-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-notif-toggle') === 'on';
        toggleStudioNotifications(next);
      });
    });
  }

  async function onSaveSection(sectionId, form) {
    const section = EDIT_SECTIONS.find((s) => s.id === sectionId);
    if (!section) return;
    const session = readSession();
    if (!session || !session.token) {
      alert('Your session has expired. Please verify your email again.');
      return;
    }
    const fd = new FormData(form);
    const patch = {};
    section.fields.forEach((f) => {
      const v = fd.get(f.name);
      patch[f.name] = v == null ? '' : String(v).trim();
    });
    const msgEl = form.querySelector('[data-edit-msg]');
    const saveBtn = form.querySelector('[data-edit-save]');
    const cancelBtn = form.querySelector('[data-edit-cancel]');
    msgEl.className = 'acct-edit-msg';
    msgEl.textContent = 'Saving…';
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    try {
      const resp = await fetch(FN_BASE + 'studio-self-edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: session.token, payload: patch }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        msgEl.className = 'acct-edit-msg err';
        msgEl.textContent = (data && data.error) || 'Could not save. Please try again.';
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        return;
      }
      // Merge the server's authoritative values back into acctState
      // so the recap render reflects the saved state precisely.
      const merged = Object.assign({}, acctState.submission, data.submission || patch);
      acctState.submission = merged;
      acctState.editing[sectionId] = false;
      renderAccount({ submission: merged, invoices: acctState.invoices, quotes: acctState.quotes, conversation: acctState.conv });
    } catch (err) {
      console.error('section save failed', err);
      msgEl.className = 'acct-edit-msg err';
      msgEl.textContent = 'We could not reach the server. Check your connection and try again.';
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  }

  // ------------------------------------------------------------------
  // Inline messages — thread + composer hydration. Auths against
  // portal-conversation using the conversation_id + studio_token returned
  // by get-studio-account (both always exist now; the loader mints them
  // if they don't already). Polls every 15s while the tab is visible so
  // admin replies render without a manual refresh. We can't use Supabase
  // realtime here because messages has admin-only RLS and the studio has
  // no JWT — polling matches the existing portal.html pattern.
  const MAX_MSG_FILES = 5;
  const MAX_MSG_BYTES = 25 * 1024 * 1024;
  const msgState = { convId: null, token: null, sending: false, pollTimer: null, pendingFiles: [] };

  function initMessages(conv) {
    if (!conv || !conv.id || !conv.token) {
      const thread = document.getElementById('acctThread');
      if (thread) thread.innerHTML = '<div class="acct-thread-empty">We could not load your conversation. Please refresh the page.</div>';
      return;
    }
    msgState.convId = conv.id;
    msgState.token = conv.token;
    msgState.pendingFiles = [];

    const form = document.getElementById('acctCompose');
    const body = document.getElementById('acctMsgBody');
    const fileInput = document.getElementById('acctMsgFileInput');
    const filesHost = document.getElementById('acctMsgFiles');
    if (form) form.addEventListener('submit', onMsgSend);
    if (body) {
      body.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    }
    if (fileInput) {
      fileInput.addEventListener('change', () => {
        addPendingMsgFiles(fileInput.files);
        fileInput.value = '';
      });
    }
    if (filesHost) {
      filesHost.addEventListener('click', (e) => {
        const rm = e.target.closest('[data-msg-rm]');
        if (!rm) return;
        msgState.pendingFiles.splice(Number(rm.getAttribute('data-msg-rm')), 1);
        renderMsgFileChips();
      });
    }

    loadThread(true).then(() => markThreadRead());
    startMsgPolling();
  }

  function addPendingMsgFiles(fileList) {
    const errEl = document.getElementById('acctMsgErr');
    if (errEl) errEl.textContent = '';
    const cap = MAX_MSG_FILES - msgState.pendingFiles.length;
    if (cap <= 0) {
      if (errEl) errEl.textContent = `You've hit the ${MAX_MSG_FILES}-file limit.`;
      return;
    }
    let firstError = '';
    let added = 0;
    for (const f of Array.from(fileList)) {
      if (added >= cap) {
        firstError = firstError || `Only ${cap} more file${cap === 1 ? '' : 's'} fit before the ${MAX_MSG_FILES}-file limit.`;
        break;
      }
      if (f.size <= 0) { firstError = firstError || `${f.name} is empty.`; continue; }
      if (f.size > MAX_MSG_BYTES) {
        firstError = firstError || `${f.name} is over the ${MAX_MSG_BYTES / 1024 / 1024} MB limit.`;
        continue;
      }
      msgState.pendingFiles.push(f);
      added++;
    }
    if (errEl && firstError) errEl.textContent = firstError;
    renderMsgFileChips();
  }

  function renderMsgFileChips() {
    const host = document.getElementById('acctMsgFiles');
    if (!host) return;
    if (!msgState.pendingFiles.length) { host.innerHTML = ''; return; }
    host.innerHTML = msgState.pendingFiles.map((f, i) => {
      const over = f.size > MAX_MSG_BYTES;
      return `<span class="acct-file-chip${over ? ' oversize' : ''}">
        📎 ${esc(f.name)} <span style="color:var(--g6);font-size:11px;">${esc(formatBytesAcct(f.size))}</span>
        <button type="button" data-msg-rm="${i}" aria-label="Remove">×</button>
      </span>`;
    }).join('');
  }

  function formatBytesAcct(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  async function uploadMsgAttachments(messageId, files) {
    const failures = [];
    for (const file of files) {
      const fd = new FormData();
      fd.append('conversation_id', msgState.convId);
      fd.append('token', msgState.token);
      fd.append('message_id', messageId);
      fd.append('file', file);
      try {
        const resp = await fetch(FN_BASE + 'upload-submission-attachment', { method: 'POST', body: fd });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || data?.ok === false) {
          failures.push(`${file.name}${data?.error ? ` (${data.error})` : ''}`);
        }
      } catch (_) { failures.push(file.name); }
    }
    return failures.length ? failures.join(', ') : null;
  }

  async function msgApi(action, extra) {
    const resp = await fetch(FN_BASE + 'portal-conversation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action,
        conversation_id: msgState.convId,
        token: msgState.token,
        ...(extra || {}),
      }),
    });
    let data = null;
    try { data = await resp.json(); } catch (_) { /* ignore */ }
    return { ok: resp.ok && data?.ok !== false, status: resp.status, data };
  }

  async function loadThread(scroll) {
    const res = await msgApi('load');
    const host = document.getElementById('acctThread');
    if (!host) return;
    if (!res.ok) {
      host.innerHTML = '<div class="acct-thread-empty">We could not load your conversation. Please refresh.</div>';
      return;
    }
    const messages = res.data?.messages || [];
    if (!messages.length) {
      host.innerHTML = '<div class="acct-thread-empty">No messages yet. Say hello below and we will get back to you shortly.</div>';
      return;
    }
    host.innerHTML = messages.map(renderThreadMsg).join('');
    if (scroll) host.scrollTop = host.scrollHeight;
  }

  function renderThreadMsg(m) {
    const isStudio = m.sender_role === 'studio';
    const isSystem = m.sender_role === 'system';
    const cls = isSystem
      ? 'acct-msg-bubble acct-msg-system'
      : (isStudio ? 'acct-msg-bubble acct-msg-mine' : 'acct-msg-bubble acct-msg-them');
    const who = isSystem ? '' : (isStudio ? (m.sender_name || 'You') : (m.sender_name || 'StudioLAB Growth'));
    const ts = new Date(m.created_at).toLocaleString('en-AU', {
      dateStyle: 'medium', timeStyle: 'short', timeZone: 'Australia/Sydney',
    });
    const bodyHtml = m.body_html || textToHtml(m.body_text || '');
    if (isSystem) {
      return `<div class="${cls}"><div class="acct-msg-body">${bodyHtml} · ${esc(ts)}</div></div>`;
    }
    return `
      <div class="${cls}">
        <div class="acct-msg-meta">${esc(who)} · ${esc(ts)}</div>
        <div class="acct-msg-body">${bodyHtml}</div>
      </div>`;
  }

  // Plain-text → minimal HTML for client-side rendering of any message
  // that didn't ship body_html (system events, legacy rows). Server-side
  // textToHtml in portal-conversation does the heavier lifting for new
  // studio sends; this is just a render fallback.
  function textToHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  async function onMsgSend(e) {
    e.preventDefault();
    if (msgState.sending) return;
    const errEl = document.getElementById('acctMsgErr');
    const sendBtn = document.getElementById('acctMsgSend');
    const bodyEl = document.getElementById('acctMsgBody');
    errEl.textContent = '';
    const text = (bodyEl.value || '').trim();
    // Empty body is allowed if there are attachments — let people send
    // a file with no message body.
    if (!text && !msgState.pendingFiles.length) {
      errEl.textContent = 'Type a message or attach a file.';
      return;
    }
    if (text.length > 10000) { errEl.textContent = 'Message is too long (max 10,000 characters).'; return; }

    msgState.sending = true;
    sendBtn.disabled = true;
    const senderName = window.__acctSenderName || null;
    const senderEmail = window.__acctSenderEmail || null;
    const res = await msgApi('send', { body_text: text || '(attachment)', sender_name: senderName, sender_email: senderEmail });
    if (!res.ok) {
      msgState.sending = false;
      sendBtn.disabled = false;
      errEl.textContent = (res.data && res.data.error) || 'Could not send. Please try again.';
      return;
    }
    const messageId = res.data?.message_id;
    let attErr = null;
    if (msgState.pendingFiles.length && messageId) {
      attErr = await uploadMsgAttachments(messageId, msgState.pendingFiles);
    }
    msgState.sending = false;
    sendBtn.disabled = false;
    bodyEl.value = '';
    msgState.pendingFiles = [];
    renderMsgFileChips();
    if (attErr) errEl.textContent = 'Message sent, but some attachments failed: ' + attErr;
    await loadThread(true);
  }

  async function markThreadRead() {
    try { await msgApi('mark-read'); } catch (_) { /* best effort */ }
  }

  function startMsgPolling() {
    if (msgState.pollTimer) return;
    msgState.pollTimer = setInterval(() => {
      if (document.hidden) return;
      // Preserve scroll position unless the user is already at the bottom.
      const host = document.getElementById('acctThread');
      if (!host) return;
      const wasAtBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 40;
      loadThread(wasAtBottom);
    }, 15000);
  }

  async function load() {
    // Honour location.hash for deep-linking — receipt email's
    // "View your account" link can point at /account.html#billing to
    // land on Invoices, etc. Only accept values we recognise.
    const hash = (window.location.hash || '').replace('#', '');
    if (hash === 'home' || hash === 'billing' || hash === 'setup') {
      acctState.activeTab = hash;
    }

    const session = readSession();
    if (!session || !session.token) {
      renderError('You will need to verify your email again to see your account. Open your most recent email from us and click the setup link.');
      return;
    }

    try {
      const resp = await fetch(FN_BASE + 'get-studio-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: session.token }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        renderError((data && data.error) || 'Could not load your account. Please try again in a moment.');
        return;
      }
      renderAccount(data);
    } catch (err) {
      console.error('account load failed', err);
      renderError('We could not reach the server. Check your connection and refresh the page.');
    }
  }

  load();
})();
</script>

</body>
</html>
