# Per-function gateway settings.
#
# The cron-invoked functions authenticate with CRON_SECRET in the Authorization
# header, which is not a JWT. With the platform's default verify_jwt = true the
# gateway rejects them with UNAUTHORIZED_INVALID_JWT_FORMAT before the function
# ever runs, so the nightly job fails silently.
#
# These were originally deployed with --no-verify-jwt on the command line, which
# is invisible in the repo and is lost the moment anyone redeploys without the
# flag. (That happened on 2026-08-20: redeploying nudge-abandoned-kb for an
# unrelated fix re-enabled JWT verification and broke its cron.) Declaring it
# here makes the setting part of the code, so a plain `supabase functions deploy`
# keeps it.
#
# Each of these refuses to run without a valid CRON_SECRET bearer token, so
# turning the gateway check off does not make them publicly callable.

[functions.nudge-abandoned-onboarding]
verify_jwt = false

[functions.nudge-abandoned-kb]
verify_jwt = false

[functions.nudge-setup-tasks]
verify_jwt = false

[functions.quote-reminders]
verify_jwt = false

[functions.cleanup-attachments]
verify_jwt = false
