# Per-function gateway settings.
#
# The cron-invoked functions authenticate with CRON_SECRET in the Authorization
# header, which is not a JWT. With the platform's default verify_jwt = true the
# gateway rejects them with UNAUTHORIZED_INVALID_JWT_FORMAT before the function
# ever runs, so the nightly job fails silently.
#
# These were originally deployed with --no-verify-jwt on the command line, which
# is invisible in the repo and is lost the moment anyone redeploys without the
# flag. (That happened on 2026-08-20: redeploying nudge-abandoned-kb for an
# unrelated fix re-enabled JWT verification and broke its cron.) Declaring it
# here makes the setting part of the code, so a plain `supabase functions deploy`
# keeps it.
#
# Each of these refuses to run without a valid CRON_SECRET bearer token, so
# turning the gateway check off does not make them publicly callable.

[functions.nudge-abandoned-onboarding]
verify_jwt = false

# ops-reminders needs this for a second reason as well as the cron: its
# one-click "mark done" link is opened straight from an email client, which
# carries no Authorization header at all. The link's own random token is the
# gate, and the worst it can do is close a reminder.
[functions.ops-reminders]
verify_jwt = false

[functions.nudge-setup-tasks]
verify_jwt = false

[functions.quote-reminders]
verify_jwt = false

[functions.cleanup-attachments]
verify_jwt = false

# Same reason as the others: pg_cron presents CRON_SECRET, which is not a JWT.
# This one is listed last because it was scheduled later (migration 050) and was
# NOT here when it was first deployed, which would have made its very first
# scheduled run fail at the gateway with the fault it exists to detect.
[functions.stripe-webhook-health]
verify_jwt = false

# Database-trigger targets. These are NOT public despite the flag: each one
# requires CRON_SECRET, presented by its trigger from the Vault (migration 053).
#
# The flag is set because the trigger's bearer is CRON_SECRET, which is not a
# JWT. Turning the gateway check off removes nothing that was protecting them:
# it accepts any validly signed project JWT, and the publishable key satisfying
# it ships in the page source, so all three were reachable by anyone who viewed
# source. on-submission sent mail to an address taken straight from the posted
# record. The real gate is now the shared secret checked in code.
[functions.on-submission]
verify_jwt = false

[functions.sync-to-sheet]
verify_jwt = false

[functions.notify-new-message]
verify_jwt = false

# Anon-callable from payment-confirm.html with only the studio's session token,
# the same posture the page's previous poller had.
[functions.get-submission-status]
verify_jwt = false

# The public onboarding gate. js/form.js calls both of these from the studio's browser with NO
# Authorization header at all (see callFn), so on the platform default the gateway would 401 every
# request BEFORE our code ran and no studio could sign in. Verified against production on 2026-08-20:
# an unauthenticated POST to send-otp returns our own 400, not a gateway 401, so this is already the
# live setting - it was just never written down, which meant one redeploy without the flag would have
# silently taken the live form offline. Declared here so it cannot be lost again.
#
# Turning the gateway check off does not make these unguarded: send-otp mails a code to an address it
# resolves itself, and verify-otp requires that code. The pre-bind token path adds no new authority -
# it only lets the server look up an address it already holds.
[functions.send-otp]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

# The same reasoning as send-otp/verify-otp above, for every OTHER function js/form.js and the
# studio-facing pages call without an Authorization header. These were all already deployed with the
# gateway off; none of them said so, which meant one redeploy without the flag would have taken that
# surface offline with no warning. save-draft is the autosave every mid-onboarding studio depends on.
[functions.save-draft]
verify_jwt = false

[functions.claim-draft]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.resolve-pricing]
verify_jwt = false

[functions.get-studio-account]
verify_jwt = false

[functions.apply-change-request]
verify_jwt = false

[functions.validate-change-request]
verify_jwt = false

# Stripe calls this with its own HMAC in the Stripe-Signature header and NO Authorization header,
# so the platform default would 401 every event before our code ran. It has always been deployed
# with --no-verify-jwt on the command line and never said so here, which is the same trap the
# block above describes: one redeploy without the flag silently takes payment processing offline.
# Recorded 2026-08-26, while fixing the related outage where the live endpoint was never registered
# in Stripe at all and a real studio's payment landed with no receipt and no admin notification.
[functions.stripe-webhook]
verify_jwt = false
